<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gym Hub: catat latihan gym dan conditioning dengan alat dan gerakan sendiri.">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Graphite: instrument-panel look. One phone-width column (max 560px), fixed bottom tab bar, bottom sheets.
   Accent is bumper-plate red with a soft glow in dark mode; plate blue/yellow/green mark Strava, set and block types.
   Numbers that change while training use a mono face so columns do not jitter. */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#eceef2; --line:#e1e4ea; --line-strong:#cdd2da;
  --ink:#11141a; --ink-2:#4a5160; --ink-3:#737c8b;
  --accent:#d93d26; --accent-ink:#ffffff; --accent-soft:#fbe4df;
  --blue:#2a63d6; --blue-soft:#e2eafb; --yellow:#a77d00; --yellow-soft:#fbf1d4; --green:#1f8049; --green-soft:#ddf1e5;
  --done:rgba(31,128,73,.09); --scrim:rgba(10,12,16,.5); --img-bg:#ffffff;
  --hero:#11141a; --hero-ink:#f3f4f6; --hero-2:#9aa3b0; --hero-line:rgba(255,255,255,.12); --hero-cell:rgba(255,255,255,.08);
  --glow:rgba(224,68,44,0); --heat-0:#e6e9ee; --body-base:#d3d8df; --sec:#f2b0a3; --shadow:0 1px 2px rgba(16,20,26,.04),0 6px 20px rgba(16,20,26,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0c0f; --surface:#13161b; --surface-2:#1a1e25; --line:#232831; --line-strong:#323945;
  --ink:#eef0f3; --ink-2:#b2b9c4; --ink-3:#7f8896;
  --accent:#ff5a3d; --accent-ink:#ffffff; --accent-soft:#3a1c16;
  --blue:#5b8cff; --blue-soft:#18233d; --yellow:#e7bb3c; --yellow-soft:#2f2711; --green:#3fbf7a; --green-soft:#12291c;
  --done:rgba(63,191,122,.10); --scrim:rgba(0,0,0,.65); --img-bg:#e9ebee;
  --hero:#13161b; --hero-ink:#eef0f3; --hero-2:#8d96a3; --hero-line:rgba(255,255,255,.09); --hero-cell:rgba(255,255,255,.06);
  --glow:rgba(255,90,61,.35); --heat-0:#20252d; --body-base:#2c323c; --sec:#5c2c23; --shadow:none;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0c0f; --surface:#13161b; --surface-2:#1a1e25; --line:#232831; --line-strong:#323945;
  --ink:#eef0f3; --ink-2:#b2b9c4; --ink-3:#7f8896;
  --accent:#ff5a3d; --accent-ink:#ffffff; --accent-soft:#3a1c16;
  --blue:#5b8cff; --blue-soft:#18233d; --yellow:#e7bb3c; --yellow-soft:#2f2711; --green:#3fbf7a; --green-soft:#12291c;
  --done:rgba(63,191,122,.10); --scrim:rgba(0,0,0,.65); --img-bg:#e9ebee;
  --hero:#13161b; --hero-ink:#eef0f3; --hero-2:#8d96a3; --hero-line:rgba(255,255,255,.09); --hero-cell:rgba(255,255,255,.06);
  --glow:rgba(255,90,61,.35); --heat-0:#20252d; --body-base:#2c323c; --sec:#5c2c23; --shadow:none;
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}

.app{max-width:560px;margin:0 auto;padding-block:10px calc(170px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.brand span{color:var(--accent)}
.brand svg{width:30px;height:30px}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;letter-spacing:.005em}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:16px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--ink-3)} .small{font-size:14px} .tiny{font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.link-accent{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;background:none;border:0;padding:6px 0;min-height:32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px var(--glow)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-danger{background:transparent;border-color:transparent;color:var(--accent)}
.btn-block{width:100%}
.btn-lg{min-height:56px;font-size:19px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:14px}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.icon{width:44px;padding:0}
.icon svg{width:20px;height:20px}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 12px;min-width:0;font-size:16px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.red{background:var(--accent-soft);color:var(--accent)} .chip.blue{background:var(--blue-soft);color:var(--blue)} .chip.yellow{background:var(--yellow-soft);color:var(--yellow)} .chip.green{background:var(--green-soft);color:var(--green)}
.chip.solid{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--glow)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scale{display:grid;gap:4px}
.scale button{min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:14px;padding:0 2px;line-height:1.1}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 12px var(--glow)}
.empty{text-align:center;padding:28px 16px;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink-3);text-decoration:none;letter-spacing:.03em;position:relative}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:-5px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}

/* Hero (always dark) */
.hero{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,61,.42),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:var(--hero-2)}
.hero h1{color:inherit}
.hero-big{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:.88;letter-spacing:-.005em}
.hero-big small{font-size:20px;color:var(--hero-2);font-weight:700;margin-left:4px}
.delta{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--hero-2)}
.delta.up{color:#4fd18b} .delta.down{color:#ff8a73}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days div{height:34px;border-radius:8px;background:var(--hero-cell);display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:700;padding-bottom:3px;color:var(--hero-2)}
.days div.g{background:#ff5a3d;color:#fff;box-shadow:0 0 14px rgba(255,90,61,.45)}
.days div.s{background:#5b8cff;color:#fff}
.days div.gs{background:linear-gradient(180deg,#5b8cff 0 40%,#ff5a3d 40%);color:#fff}
.days div.today{outline:1.5px solid var(--hero-ink);outline-offset:-1.5px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hero-line);padding-top:10px}
.stat4 div{border-left:1px solid var(--hero-line);padding-left:10px;min-width:0}
.stat4 div:first-child{border-left:0;padding-left:0}
.stat4 b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.stat4 small{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--hero-2);text-transform:uppercase}

.metric{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.metric b{font-family:var(--f-display);font-size:40px;line-height:1;font-weight:800}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;height:84px}
.bars div{display:flex;flex-direction:column-reverse;border-radius:4px 4px 2px 2px;overflow:hidden;min-height:2px;background:var(--surface-2)}
.bars span{display:block}
.bars .g{background:var(--accent)} .bars .s{background:var(--blue)}
.bars-x{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;font-size:10px;color:var(--ink-3);text-align:center;font-family:var(--f-mono)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mus{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.mus .track{height:6px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.mus .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.mus .fill.ok{background:var(--green)}
.mus b{font-family:var(--f-mono);font-size:12px}
.mus2{display:flex;flex-direction:column;gap:3px;font-size:13px}
.mus2 .row{justify-content:space-between}
.mus2 b{font-family:var(--f-mono);font-size:12px}
.mus2 .track{height:5px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.mus2 .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.mus2 .fill.ok{background:var(--green)}
.bodies{display:flex;justify-content:center;gap:10px}
.bodies figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.bodies figcaption{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mfig{display:flex;justify-content:center;gap:18px;padding:4px 0 2px;background:radial-gradient(60% 55% at 50% 45%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
.mfig figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.mfig figcaption{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mrows{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.mdot{width:12px;height:12px;border-radius:4px;background:var(--accent);margin:3px 0 0 4px;box-shadow:0 0 10px var(--glow)}
.mdot.sec{background:var(--sec);box-shadow:none}
.micon{width:20px;height:20px;color:var(--ink-3)}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-3)}
.heat-legend i{display:block;width:14px;height:6px;border-radius:2px}
.pr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.pr:first-child{border-top:0}
.medal{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;background:var(--accent);color:#fff;box-shadow:0 0 12px var(--glow);flex:none}
.medal.b{background:var(--blue);box-shadow:none} .medal.y{background:var(--yellow);color:#1b1500;box-shadow:none} .medal.g{background:var(--green);box-shadow:none}
.prtag{font-family:var(--f-body);font-size:10px;font-weight:800;color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.feel-dots{display:flex;gap:6px;align-items:flex-end}
.feel-dots div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink-3);font-family:var(--f-mono)}
.feel-dots i{display:block;width:100%;max-width:28px;border-radius:6px;background:var(--green)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit;text-decoration:none;min-height:56px}
.item:first-child{border-top:0}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--ink-3)}
.item .r{margin-left:auto;text-align:right;flex:none}
.big{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.thumb{width:48px;height:48px;border-radius:10px;flex:none;background:var(--img-bg);object-fit:cover;border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--ink-3);background:linear-gradient(140deg,var(--surface-2),var(--line));font-size:18px}
.media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--img-bg);border:1px solid var(--line);aspect-ratio:4/3;max-width:100%}
.media img{width:100%;height:100%;object-fit:contain;display:block}
.media .tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.media.off{display:none}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* Stat tiles (session screens) */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles>div,.tiles>button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0;text-align:left;box-shadow:var(--shadow)}
.tiles b{display:block;font-family:var(--f-mono);font-weight:700;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles span{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.tiles .hot b{color:var(--accent)}

/* Active session */
.sess-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:8px;margin-block:-8px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent}
.sess-title{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;border:0!important;background:transparent!important;padding:0!important;min-height:34px!important;width:100%;line-height:1}
.sess-title:focus{box-shadow:none!important;border-bottom:2px solid var(--accent)!important;border-radius:0!important}
.startlbl{border:0;background:none;padding:0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-decoration:underline dotted;text-underline-offset:3px;text-align:left}
.editing{background:var(--yellow-soft);color:var(--yellow);border-radius:var(--r-sm);padding:8px 12px;font-size:14px;font-weight:600}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.block-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.block-head .grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.block.multi{border-left:3px solid var(--bc,var(--line))}
.bx{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.block-head + .bx,.blockmeta + .bx{border-top:0}
.bx:first-child{border-top:0}
.bchart{position:relative;touch-action:pan-y}
.bchart svg{display:block;overflow:visible}
.bc-tip{position:absolute;top:-6px;width:110px;padding:6px 8px;border-radius:10px;background:var(--surface-2,var(--surface));border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;flex-direction:column;font-size:12px;pointer-events:none}
.bc-tip b{font-size:14px}
.bc-tip span{color:var(--ink-3)}
.plviz{display:flex;align-items:center;height:130px;gap:3px;padding:0 4px}
.plbar{width:48px;height:14px;border-radius:3px;background:var(--line-strong)}
.plcol{width:10px;height:22px;border-radius:2px;background:var(--line-strong)}
.pl{width:22px;border-radius:4px;display:grid;place-items:center;font:700 10px/1 var(--f-mono);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

/* ================= utils ================= */

const DBN="gymhub",KEY="state-v1";

/* ================= TRAIN / HOME ================= */
function renderTrain(){ if(S.active)return renderActive(); keepAwake(false); renderHome() }
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const hm=sec=>`${Math.floor(sec/3600)}:${pad2(Math.floor(sec%3600/60))}`;
/* A Strava strength activity within 2 hours of a logged gym session is the same workout (e.g. recorded on the Coros). */
const dupAct=a=>/WeightTraining|Workout|Crossfit/.test(a.sport||"")&&S.sessions.some(se=>Math.abs(se.start-a.start)<2*36e5);
function weekTotals(from,to){
  const ss=S.sessions.filter(s=>s.start>=from&&s.start<to);let vol=0,sets=0,secs=0;
  ss.forEach(se=>{const st=sessionStats(se);vol+=st.vol;sets+=st.sets;secs+=se.end?(se.end-se.start)/1000:0});
  const acts=S.activities.filter(a=>a.start>=from&&a.start<to&&!dupAct(a));
  return{n:ss.length,vol,sets,secs:secs+acts.reduce((x,a)=>x+(a.moving||a.elapsed||0),0),acts:acts.length};
}
function renderHome(){
  const now=Date.now(),mon=weekStart(now);
  const W=weekTotals(mon,now+DAY),L=weekTotals(mon-7*DAY,now-7*DAY);
  const gymDays=new Set(S.sessions.map(s=>dayKey(s.start))),runDays=new Set(S.activities.filter(a=>!dupAct(a)).map(a=>dayKey(a.start)));
  const days=["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map((d,i)=>{const t=new Date(mon);t.setDate(t.getDate()+i);const k=dayKey(t);const g=gymDays.has(k),r=runDays.has(k);return`<div class="${g&&r?"gs":g?"g":r?"s":""} ${k===dayKey(now)?"today":""}">${d}</div>`}).join("");
  const delta=L.vol>0?Math.round((W.vol-L.vol)/L.vol*100):null;
  const h=new Date().getHours(),greet=h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam";
  const recent=S.sessions.slice().sort((a,b)=>b.start-a.start).slice(0,3);
  $("#view").innerHTML=`<div class="top"><div><div class="eyebrow">${new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}</div><h1 style="font-size:30px">${greet}</h1></div><div class="brand" aria-label="Gym Hub"><svg><use href="#i-logo"/></svg></div></div>
  <section class="hero"><div class="row between"><span class="eyebrow">Volume minggu ini</span>${delta!=null?`<span class="delta ${delta>=0?"up":"down"}">${delta>=0?"▲":"▼"} ${Math.abs(delta)}% vs minggu lalu</span>`:""}</div>
    <div class="hero-big num">${fmt(W.vol,0)}<small>kg</small></div>
    <div class="days" aria-label="Hari latihan minggu ini">${days}</div>
    <div class="stat4"><div><b class="num">${W.n}</b><small>Sesi</small></div><div><b class="num">${hm(W.secs)}</b><small>Jam</small></div><div><b class="num">${W.sets}</b><small>Set</small></div><div><b class="num">${W.acts}</b><small>Strava</small></div></div>
    <button class="btn btn-primary btn-lg btn-block" id="startBtn">Mulai latihan</button></section>
  ${tplCard()}
  ${runCard()}
  ${nextDayCard()}
  ${weekMuscleCard()}
  ${prCard()}
  ${bodyCard()}
  ${loadCard()}
  ${feelCard()}
  <div class="row between"><h2>Ulangi sesi</h2>${recent.length?`<a class="link-accent" href="#history">Riwayat ›</a>`:""}</div>
  <div class="card list">${recent.map(se=>{const st=sessionStats(se);return`<button class="item" data-repeat="${se.id}"><div class="grow"><div class="t">${esc(se.title)}</div><div class="s">${fday(se.start)} · ${se.blocks.reduce((a,b)=>a+b.items.length,0)} gerakan · ${st.sets} set</div></div><span class="chip red">Ulangi</span></button>`}).join("")||`<div class="empty"><strong>Belum ada sesi</strong>Mulai sesi pertama, atau impor riwayat Hevy di tab Lainnya.</div>`}</div>`;
  $("#startBtn").onclick=()=>startSession();
  $$("[data-repeat]").forEach(b=>b.onclick=()=>startSession(S.sessions.find(s=>s.id===b.dataset.repeat)));
  $$("[data-tpl]").forEach(b=>b.onclick=()=>tplSheet(S.templates.find(t=>t.id===b.dataset.tpl)));
  $$("[data-tplgo]").forEach(b=>b.onclick=e=>{e.stopPropagation();const t=S.templates.find(x=>x.id===b.dataset.tplgo);startTpl(t)});
  const pa=$("#prAll");pa&&(pa.onclick=prSheet);
  const nd=$("#nextDay");if(nd){const se=S.sessions.find(s=>s.id===nd.dataset.s);bindScale(nd,"ndSore",v=>{se.feel=se.feel||{};se.feel.nextSore=v;save();toast("Tercatat. Makasih!");renderHome()})}
}
function prRow(p){const ex=exById(p.exId)||{name:"(gerakan dihapus)",mode:"wr"};return `<a class="pr" href="#session-${p.seId}"><span class="medal ${MEDAL[ex.mode]||""}">PR</span><div class="grow"><b>${esc(ex.name)}</b><div class="tiny muted">${esc(prDesc(ex.mode,p.s))}</div></div><span class="mono tiny muted">${fday(p.t)}</span></a>`}
function prCard(){
  const P=allPRs().list;if(!P.length)return "";
  const wk=P.filter(p=>p.t>=weekStart(Date.now())).length;
  return `<section class="card pad"><div class="row between"><span class="eyebrow">Personal record${wk?` · ${wk} minggu ini`:""}</span><button class="link-accent" id="prAll">Semua ›</button></div><div>${P.slice(-4).reverse().map(prRow).join("")}</div></section>`;
}
function prSheet(){const P=allPRs().list.slice().reverse();sheet(`Personal record · ${P.length}`,`<div>${P.slice(0,150).map(prRow).join("")}</div><p class="tiny muted">PR dihitung saat set terbaik sebuah sesi mengalahkan semua sesi sebelumnya: est. 1RM untuk beban × rep, lalu rep, waktu, atau jarak. Set pemanasan tidak dihitung.</p>`,"")}
function nextDayCard(){
  const se=S.sessions.slice().sort((a,b)=>b.start-a.start)[0];
  if(!se||!se.end)return "";const age=Date.now()-se.end;
  if(age<10*36e5||age>60*36e5||(se.feel&&se.feel.nextSore!=null))return "";
  return `<section class="card pad stack" id="nextDay" data-s="${se.id}"><div><div class="eyebrow">Cek pemulihan</div><h2>Gimana pegalnya setelah ${esc(se.title.toLowerCase())}?</h2></div>${scale("ndSore",SORE,null,4)}</section>`;
}
function dailyLoads(days){
  const today=new Date();today.setHours(0,0,0,0);const start=today.getTime()-(days-1)*DAY;
  const arr=Array.from({length:days},(_,i)=>({t:start+i*DAY,g:0,s:0}));
  S.sessions.forEach(se=>{const i=Math.floor((se.start-start)/DAY);if(i>=0&&i<days)arr[i].g+=sessLoad(se)});
  S.activities.forEach(a=>{if(dupAct(a))return;const i=Math.floor((a.start-start)/DAY);if(i>=0&&i<days)arr[i].s+=actLoad(a)});
  return arr;
}
function loadCard(){
  const d28=dailyLoads(28),acute=d28.slice(-7).reduce((a,x)=>a+x.g+x.s,0),chronic=d28.reduce((a,x)=>a+x.g+x.s,0)/4;
  if(!acute&&!chronic)return "";
  const first=Math.min(...S.sessions.map(x=>x.start),...S.activities.map(x=>x.start),Date.now());
  const ratio=chronic&&Date.now()-first>=21*DAY?acute/chronic:null;
  const [st,cls,tip]=ratio==null?["Mengumpulkan data","","Status seimbang atau naik tajam muncul setelah 3 minggu data."]:ratio<.8?["Ringan","blue","Lebih ringan dari rata-rata 4 minggu. Aman untuk menambah."]:ratio<=1.3?["Seimbang","green","Sesuai rata-rata 4 minggu terakhir."]:["Naik tajam","red","Jauh di atas rata-rata 4 minggu. Perhatikan pemulihan."];
  const d14=d28.slice(-14),mx=Math.max(1,...d14.map(x=>x.g+x.s));
  return `<section class="card pad stack"><div class="row between"><div><div class="eyebrow">Beban latihan 7 hari</div><div class="metric"><b class="num">${fmt(acute,0)}</b><span class="chip ${cls}">${st}</span></div></div></div>
  ${tip?`<p class="small muted">${tip}</p>`:""}
  <div class="bars" role="img" aria-label="Beban harian 14 hari terakhir">${d14.map(x=>`<div style="height:${Math.max(2,(x.g+x.s)/mx*100)}%" title="${fday(x.t)}: ${x.g+x.s}">${x.g?`<span class="g" style="height:${x.g/(x.g+x.s)*100}%"></span>`:""}${x.s?`<span class="s" style="height:${x.s/(x.g+x.s)*100}%"></span>`:""}</div>`).join("")}</div>
  <div class="bars-x">${d14.map((x,i)=>`<span>${i%2?"":new Date(x.t).getDate()}</span>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Gym</span><span><i style="background:var(--blue)"></i>Strava</span><span>Durasi × RPE sesi</span></div></section>`;
}
function muscleSetsOf(list){
  const m={};list.forEach(se=>se.blocks.forEach(b=>b.items.forEach(it=>{const ex=exById(it.exId);const ms=musclesOf(ex);const n=it.sets.filter(s=>s.done&&s.k!=="w").length;ms.p.forEach(k=>m[k]=(m[k]||0)+n);ms.s.forEach(k=>m[k]=(m[k]||0)+n*.5)})));
  return m;
}
const muscleSets=sinceMs=>muscleSetsOf(S.sessions.filter(s=>s.start>=sinceMs));
function sessionHeat(se){const h={};Object.entries(muscleSetsOf([se])).forEach(([k,v])=>h[k]=Math.min(1,v/6));return h}
function weekMuscleCard(){
  const m=muscleSets(Date.now()-7*DAY);const rows=Object.entries(m).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const heat={};rows.forEach(([k,v])=>heat[k]=Math.min(1,v/10));
  const untouched=Object.keys(MUSCLES).filter(k=>!m[k]&&k!=="neck").map(k=>MUSCLES[k]);
  return `<section class="card pad stack"><div class="row between"><span class="eyebrow">Otot 7 hari</span>${heatLegend("10+ set")}</div>
  <div class="row" style="gap:14px;align-items:center">${bodies(heat,70)}
  <div class="grow stack" style="gap:8px">${rows.slice(0,6).map(([k,v])=>`<div class="mus2"><div class="row"><span>${esc(MUSCLES[k]||k)}</span><b>${fmt(v)}</b></div><span class="track"><span class="fill ${v>=10?"ok":""}" style="width:${Math.min(100,v/10*100)}%"></span></span></div>`).join("")||`<p class="small muted">Belum ada set dalam 7 hari terakhir.</p>`}</div></div>
  ${rows.length?`<p class="tiny muted">Set efektif per otot. Hijau berarti 10 set atau lebih. Otot sekunder dihitung setengah.${untouched.length?` Belum dilatih: ${esc(untouched.slice(0,4).join(", "))}${untouched.length>4?", …":""}.`:""}</p>`:""}</section>`;
}
function feelCard(){
  const ss=S.sessions.filter(s=>s.feel&&s.feel.energy!=null).sort((a,b)=>a.start-b.start).slice(-8);
  if(ss.length<2)return "";
  const avgR=ss.reduce((a,s)=>a+(s.feel.rpe||0),0)/ss.length;
  return `<section class="card pad stack"><div class="row between"><div><div class="eyebrow">Rasa setelah latihan</div><h2>Energi ${ss.length} sesi terakhir</h2></div><span class="chip">RPE rata-rata ${fmt(avgR)}</span></div>
  <div class="feel-dots" style="height:70px">${ss.map(s=>`<div><i style="height:${12+s.feel.energy*12}px;opacity:${.45+s.feel.energy*.13}"></i>${new Date(s.start).getDate()}</div>`).join("")}</div>
  <p class="tiny muted">Batang lebih tinggi berarti lebih segar setelah latihan. Terakhir: ${ENERGY[ss[ss.length-1].feel.energy]}${ss[ss.length-1].feel.sore!=null?", "+SORE[ss[ss.length-1].feel.sore].toLowerCase():""}.</p></section>`;
}

/* ================= ACTIVE SESSION ================= */
function startSession(from,tplId){
  if(S.active){location.hash="train";return route()}
  const h=new Date().getHours();
  const title=from?from.title:(h<11?"Latihan pagi":h<15?"Latihan siang":h<18?"Latihan sore":"Latihan malam");
  S.active={id:uid(),title,start:Date.now(),note:"",tplId:tplId||null,blocks:from?from.blocks.map(b=>({id:uid(),type:b.type,cap:b.cap??null,rounds:null,items:b.items.map(it=>({exId:it.exId,note:"",sets:it.sets.map(s=>({k:s.k||"n",w:null,r:null,t:null,d:null,done:false}))}))})):[]};
  save();location.hash="train";route();
}
function editSession(se){
  if(S.active){toast("Selesaikan sesi yang sedang jalan dulu");return}
  S.active=JSON.parse(JSON.stringify(se));S.active.editOf=se.id;
  save();location.hash="train";route();
}
function renderActive(){
  const se=S.active;keepAwake(true);
  $("#view").innerHTML=`
  <div class="sess-head"><div class="grow"><button class="startlbl" id="clockLbl">${se.editOf?"Edit · "+fdate(se.start):"Mulai "+ftime(se.start)}</button><input class="sess-title" id="sTitle" value="${esc(se.title)}" aria-label="Nama sesi"></div><button class="btn btn-primary" id="finish">${se.editOf?"Simpan":"Selesai"}</button></div>
  ${se.editOf?`<div class="editing">Mengedit sesi ${fdate(se.start)}. Perubahan disimpan saat kamu menekan Simpan.</div>`:""}
  <div class="tiles"><button id="clock" aria-label="Ubah waktu sesi"><b id="clockV">${se.editOf?(se.end?hm((se.end-se.start)/1000):"–"):dur((Date.now()-se.start)/1000)}</b><span>Durasi</span></button><div><b id="stVol">0</b><span>Volume kg</span></div><div><b id="stSets">0</b><span>Set</span></div><div id="stPrBox"><b id="stPr">0</b><span>PR</span></div></div>
  <div id="blocks" class="stack" style="gap:12px">${se.blocks.map(renderBlock).join("")||`<div class="card empty"><strong>Sesi sudah jalan</strong>Tambah gerakan pertama. Bisa angkat beban, kerja di mat, atau circuit.</div>`}</div>
  <div class="row"><button class="btn btn-soft grow" id="addEx">＋ Gerakan</button><button class="btn grow" id="addCircuit">＋ Circuit / superset</button></div>
  ${se.blocks.length>1?`<button class="btn" id="sortBtn">Ubah urutan gerakan</button>`:""}
  <div class="field"><label for="sNote">Catatan sesi</label><textarea id="sNote" placeholder="Energi, tidur, keluhan…">${esc(se.note||"")}</textarea></div>
  <button class="btn btn-danger" id="discard">${se.editOf?"Batalkan edit":"Buang sesi ini"}</button>`;
  if(!se.editOf)tick=setInterval(()=>{const c=$("#clockV");if(c)c.textContent=dur((Date.now()-se.start)/1000)},1000);
  $("#sTitle").oninput=e=>{se.title=e.target.value;save()};
  $("#sNote").oninput=e=>{se.note=e.target.value;save()};
  $("#clock").onclick=$("#clockLbl").onclick=()=>timeSheet(se,!!se.editOf);
  $("#addEx").onclick=()=>pickExercises("single");
  $("#addCircuit").onclick=()=>pickExercises("circuit");
  const sb=$("#sortBtn");sb&&(sb.onclick=reorderSheet);
  $("#finish").onclick=finishSession;
  $("#discard").onclick=()=>se.editOf?(S.active=null,stopTimer(),save(),location.hash="session-"+se.editOf):confirmSheet("Buang sesi?","Semua set di sesi ini akan dihapus dan tidak masuk riwayat.","Buang",()=>{S.active=null;stopTimer();save();route()});
  bindBlocks();drawTimer();updStats();
}
function timeSheet(se,saved){
  sheet(saved?"Waktu sesi":"Ubah jam mulai",`<div class="grid2"><div class="field"><label for="tDate">Tanggal</label><input type="date" id="tDate" value="${isoDate(se.start)}"></div><div class="field"><label for="tStart">Jam mulai</label><input type="time" id="tStart" value="${hhmm(se.start)}"></div></div>
  ${saved?`<div class="field"><label for="tDur">Durasi (menit)</label><input type="number" inputmode="numeric" id="tDur" value="${se.end?Math.round((se.end-se.start)/6e4):""}"></div>`:`<p class="small muted">Lupa menekan mulai? Atur jam mulai yang benar, durasi akan dihitung ulang.</p>`}`,
  `<button class="btn btn-primary btn-block" id="tSave">Simpan waktu</button>`,sc=>{
    $("#tSave",sc).onclick=()=>{
      const [y,mo,d]=$("#tDate").value.split("-").map(Number),[hh,mm]=$("#tStart").value.split(":").map(Number);
      if(!y||hh==null){toast("Tanggal atau jam belum lengkap");return}
      const ns=new Date(y,mo-1,d,hh,mm).getTime();
      if(!saved&&ns>Date.now()){toast("Jam mulai tidak boleh di masa depan");return}
      const len=se.end?se.end-se.start:null;se.start=ns;
      if(saved){const m=num($("#tDur").value);se.end=m?ns+m*6e4:(len?ns+len:ns)}
      save();closeSheet();toast("Waktu diperbarui");route();
    };
  });
}
function renderBlock(b){
  const [label,color]=BTYPES[b.type]||BTYPES.single;
  const multi=b.type!=="single";
  const timed=["emom","amrap","tabata"].includes(b.type);
  return `<section class="block ${multi?"multi":""}" style="--bc:var(--${color==="red"?"accent":color||"line"})" data-b="${b.id}">
    ${multi?`<div class="block-head"><div class="grow"><span class="chip ${color}">${label}</span>${b.type==="tabata"?'<span class="small muted">8 × 20/10 dtk</span>':""}</div>${timed?`<button class="btn btn-sm btn-soft" data-itimer="${b.id}"><svg width="14" height="14"><use href="#i-play"/></svg>Timer</button>`:""}<button class="btn btn-ghost icon" data-bmenu="${b.id}" aria-label="Opsi blok"><svg><use href="#i-dots"/></svg></button></div>
    ${["emom","amrap"].includes(b.type)?`<div class="blockmeta"><div class="field"><label>Durasi (menit)</label><input type="number" inputmode="numeric" data-bf="cap" value="${b.cap??""}" placeholder="${b.type==="emom"?"10":"12"}"></div><div class="field"><label>${b.type==="amrap"?"Ronde selesai":"Menit selesai"}</label><input type="number" inputmode="numeric" data-bf="rounds" value="${b.rounds??""}"></div></div>`:""}`:""}
    ${b.items.map((it,i)=>renderItem(b,it,i)).join("")}
    ${multi?`<div class="bx"><div class="bx-actions"><button class="btn btn-soft btn-sm grow" data-round="${b.id}">＋ Ronde (semua gerakan)</button><button class="btn btn-sm" data-addto="${b.id}">＋ Gerakan ke blok</button></div></div>`:""}
  </section>`;
}
function renderItem(b,it,i){
  const ex=exById(it.exId)||{name:"(gerakan dihapus)",mode:"wr"};const M=MODES[ex.mode]||MODES.wr;
  const prev=prevSetsFor(it.exId,S.active.editOf||S.active.id);
  const cols=M.cols.map(c=>c[0]==="e"?"42px":"minmax(0,1fr)").join(" ");const prJ=itemPR(it,S.active);
  const eq=eqById(ex.eqId);const hasT=M.cols.some(c=>c[0]==="t");const g=suggestFor(ex,prev);
  return `<div class="bx" data-i="${i}">
    <div class="bx-name">${thumb(ex.libId,ex.name)}<div class="grow"><button class="link" data-exinfo="${it.exId}">${esc(ex.name)}</button>${eq?`<div class="tiny muted">${esc(eq.name)}</div>`:""}</div><button class="btn btn-ghost icon" data-imenu="${b.id}:${i}" aria-label="Opsi gerakan"><svg><use href="#i-dots"/></svg></button></div>
    ${it.note?`<div class="small muted">${esc(it.note)}</div>`:""}
    ${g&&it.sets.some(x=>!x.done&&x.k!=="w")?`<button class="sug" data-sug="${esc(g.why)}"><span class="chip green">Target</span><b class="num">${sugText(ex,g)}</b><span class="tiny muted">${esc(g.tag)}</span><span class="tiny" style="color:var(--accent);margin-left:auto">Kenapa?</span></button>`:""}
    <div class="sets" style="--cols:${cols}">
      <div class="set head"><span>Set</span><span>Sebelumnya</span>${M.cols.map(c=>`<span>${c[1]}</span>`).join("")}<span></span></div>
      ${it.sets.map((s,j)=>{const p=prev[j]||prev[prev.length-1];return `<div class="set ${s.done?"done":""} ${j===prJ?"pr":""}" data-j="${j}">
        <button class="sidx ${s.k&&s.k!=="n"?s.k:""}" data-kind aria-label="Jenis set: ${SETK_NAME[s.k||"n"]}">${SETK[s.k||"n"]||j+1-it.sets.slice(0,j).filter(x=>x.k==="w").length}</button>
        <span class="prev">${j===prJ?"● PR":p?prevText(p,ex.mode):"–"}</span>
        ${M.cols.map(([f])=>`<input type="number" inputmode="decimal" step="any" data-f="${f}" value="${s[f]??""}" placeholder="${g&&s.k!=="w"&&g[f]!=null?g[f]:p&&p[f]!=null?p[f]:f==="e"?"–":""}" aria-label="${({w:"Beban kg",r:"Rep",t:"Detik",d:"Meter",e:"RPE"})[f]}">`).join("")}
        <button class="check" data-done aria-label="Tandai set selesai" aria-pressed="${!!s.done}"><svg><use href="#i-check"/></svg></button>
      </div>`}).join("")}
    </div>
    <div class="bx-actions"><button class="btn btn-sm grow" data-addset>＋ Set</button>${ex.mode==="wr"&&eq&&eq.kind==="barbel"?`<button class="btn btn-sm btn-soft" data-plates>Plat</button>`:""}${hasT&&b.type!=="tabata"&&it.sets.some(s=>!s.done)?`<button class="btn btn-sm btn-soft" data-stimer><svg width="14" height="14"><use href="#i-play"/></svg>Timer set</button>`:""}${it.sets.length?`<button class="btn btn-ghost btn-sm" data-delset>Hapus set</button>`:""}</div>
  </div>`;
}
function findB(id){return S.active.blocks.find(b=>b.id===id)}
function completeSet(b,it,j,iIdx){
  const s=it.sets[j],ex=exById(it.exId)||{mode:"wr"};
  const prev=prevSetsFor(it.exId,S.active.editOf||S.active.id);const p=prev[j]||prev[prev.length-1]||(j>0?it.sets[j-1]:null);
  const g=s.k!=="w"?suggestFor(ex,prev):null;
  MODES[ex.mode].cols.forEach(([f])=>{if(f==="e"||s[f]!=null)return;if(g&&g[f]!=null)s[f]=g[f];else if(p&&p[f]!=null)s[f]=p[f]});
  const need=ex.mode==="r"?"r":MODES[ex.mode].cols[0][0];
  if(s[need]==null)return false;
  s.done=true;s.at=Date.now();buzz(15);
  const v=setScore(ex.mode,s),pb=priorBest(it.exId,S.active),others=Math.max(0,...it.sets.filter(x=>x!==s).map(x=>setScore(ex.mode,x)));

/* ---------- timers (rest, set countdown/stopwatch, interval) ---------- */
let TI=null;
function setT(t){S.active&&(S.active.timer=t);save();clearInterval(TI);if(t)TI=setInterval(drawTimer,200);drawTimer()}
function stopTimer(){if(S.active)S.active.timer=null;clearInterval(TI);TI=null;$("#timer").hidden=true;$("#timer").innerHTML="";save()}
function startRest(sec,name){if(!sec)return;setT({kind:"rest",end:Date.now()+sec*1000,total:sec,label:"Istirahat"+(name?" · "+name:"")})}
function setTimerFor(b,i){
  const it=b.items[i],ex=exById(it.exId);const j=it.sets.findIndex(s=>!s.done);if(j<0)return;
  const prev=prevSetsFor(it.exId,S.active.id);const target=it.sets[j].t||(prev[j]||prev[prev.length-1]||{}).t||null;
  const base={bid:b.id,i,j,label:`${ex?ex.name:"Set"} · set ${j+1}`};
  beep(1);
  if(target)setT({kind:"set",...base,start:Date.now()+3000,end:Date.now()+3000+target*1000,total:target});
  else setT({kind:"watch",...base,start:Date.now()+3000});
}
function intervalTimer(b){
  if(b.type==="tabata")setT({kind:"tabata",bid:b.id,start:Date.now()+3000,label:"Tabata"});
  else{const cap=b.cap||(b.type==="emom"?10:12);b.cap=cap;setT({kind:b.type,bid:b.id,start:Date.now()+3000,end:Date.now()+3000+cap*60000,total:cap*60,label:BTYPES[b.type][0]+" "+cap+" menit"})}
  beep(1);

let lastPhase=null;
function drawTimer(){
  const el=$("#timer"),t=S&&S.active&&S.active.timer;
  if(!t){el.hidden=true;return}
  const now=Date.now();let big="",lbl=t.label,frac=0,work=false,btns="";
  const pre=t.start&&now<t.start;
  if(pre){big=Math.ceil((t.start-now)/1000)+"";lbl="Siap · "+t.label;if(lastPhase!=="pre"+big){lastPhase="pre"+big;beep(1)}}
  else if(t.kind==="rest"){const left=(t.end-now)/1000;if(left<=0){beep(3,true);buzz([200,100,200]);toast("Istirahat selesai");return stopTimer()}big=dur(left);frac=left/t.total;if(left<=3.05&&lastPhase!=="r"+Math.ceil(left)){lastPhase="r"+Math.ceil(left);beep(1)}btns=`<button data-t="-15">−15</button><button data-t="15">+15</button>`}
  else if(t.kind==="set"){const left=(t.end-now)/1000;work=true;if(left<=0){beep(3,true);buzz([300]);finishTimedSet(t,t.total);return}big=dur(left);frac=left/t.total}
  else if(t.kind==="watch"){work=true;big=dur((now-t.start)/1000);btns=`<button data-t="stopw">Selesai</button>`}
  else if(t.kind==="amrap"||t.kind==="emom"){const left=(t.end-now)/1000;work=true;if(left<=0){beep(3,true);buzz([400]);const b=findB(t.bid);if(b&&t.kind==="emom")b.rounds=Math.round(t.total/60);toast("Waktu habis");stopTimer();if(location.hash==="#train"||!location.hash)renderActive();return}
    if(t.kind==="emom"){const el2=(now-t.start)/1000,min=Math.floor(el2/60),inMin=60-el2%60;big=dur(inMin);lbl=`EMOM · menit ${min+1} dari ${Math.round(t.total/60)}`;frac=inMin/60;if(lastPhase!=="m"+min){if(min>0)beep(2,true);lastPhase="m"+min}}
    else{big=dur(left);frac=left/t.total}}
  else if(t.kind==="tabata"){const el2=(now-t.start)/1000,round=Math.floor(el2/30),inR=el2%30;if(round>=8){beep(3,true);toast("Tabata selesai");return stopTimer()}work=inR<20;const left=work?20-inR:30-inR;big=Math.ceil(left)+"";lbl=`Tabata · ronde ${round+1}/8 · ${work?"KERJA":"istirahat"}`;frac=left/(work?20:10);const ph=round+(work?"w":"r");if(lastPhase!==ph){lastPhase=ph;beep(work?2:1,work)}}
  el.hidden=false;
  el.innerHTML=`<div class="timer-in ${work&&!pre?"work":""}"><div class="grow"><div class="lbl">${esc(lbl)}</div><b class="num">${big}</b></div>${pre?"":btns}<button data-t="stop">${t.kind==="rest"?"Lewati":"Stop"}</button><span class="bar" style="width:${Math.max(0,Math.min(1,frac))*100}%"></span></div>`;
  el.onclick=e=>{const b=e.target.closest("[data-t]");if(!b||!S.active||!S.active.timer)return;const tt=S.active.timer;const v=b.dataset.t;
    if(v==="stop")return stopTimer();
    if(v==="stopw")return finishTimedSet(tt,Math.round((Date.now()-tt.start)/1000));
    tt.end+=+v*1000;tt.total=Math.max(tt.total,(tt.end-Date.now())/1000);save();drawTimer()};
}
function finishTimedSet(t,sec){
  const b=findB(t.bid);stopTimer();if(!b)return;const it=b.items[t.i];if(!it)return;const s=it.sets[t.j];if(!s)return;
  s.t=sec;completeSet(b,it,t.j,t.i);save();toast(`Set tercatat: ${sec} detik`);if($("#blocks"))rerenderBlock(b),updStats();
}

function bodyCard(){

function bspark(P,w,h){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1,y0=Math.min(...ys),y1=Math.max(...ys);const X=t=>(t-x0)/((x1-x0)||1)*(w-6)+3,Y=v=>h-3-(v-y0)/((y1-y0)||1)*(h-6);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" aria-hidden="true" style="display:block;overflow:visible"><polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${P.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/><circle cx="${X(xs[xs.length-1])}" cy="${Y(ys[ys.length-1])}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>`}
function bodyChart(P,unit){
  const W=360,H=200,L=40,R=12,T=12,B=26;
  if(P.length<2)return `<div class="empty small">${P.length?"Butuh minimal 2 catatan untuk grafik.":"Belum ada data untuk ukuran ini."}</div>`;
  const xs=P.map(p=>p.t),ys=P.map(p=>p.v);const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=Math.max((y1-y0)*.15,.5);y0-=pad;y1+=pad;
  const X=t=>L+(t-x0)/((x1-x0)||1)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const ticks=[0,1,2,3].map(i=>y0+(y1-y0)*i/3);
  const xt=[x0,(x0+x1)/2,x1];
  return `<div class="bchart" data-pts='${JSON.stringify(P.map(p=>[Math.round(X(p.t)*10)/10,Math.round(Y(p.v)*10)/10,fday(p.t),fmt(p.v,1)+" "+unit]))}'><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik tren">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmt(v,1)}</text>`).join("")}
  ${xt.map((t,i)=>`<text x="${X(t)}" y="${H-6}" text-anchor="${["start","middle","end"][i]}" font-size="10" fill="var(--ink-3)">${new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short"})}</text>`).join("")}
  <polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${P.map(p=>X(p.t).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ")}"/>
  ${P.length<=40?P.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join(""):""}
  <g class="bc-h" style="display:none"><line y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/><circle r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></g>
  <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" class="bc-hit"/></svg><div class="bc-tip" hidden></div></div>`;
}
function bindChart(root){
  const c=$(".bchart",root);if(!c)return;const pts=JSON.parse(c.dataset.pts),svg=$("svg",c),g=$(".bc-h",c),tip=$(".bc-tip",c);
  const show=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*360;let best=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p});
    g.style.display="";g.querySelector("line").setAttribute("x1",best[0]);g.querySelector("line").setAttribute("x2",best[0]);g.querySelector("circle").setAttribute("cx",best[0]);g.querySelector("circle").setAttribute("cy",best[1]);
    tip.hidden=false;tip.innerHTML=`<b>${best[3]}</b><span>${best[2]}</span>`;const px=best[0]/360*r.width;tip.style.left=Math.min(Math.max(px-50,0),r.width-110)+"px"};
  const hit=$(".bc-hit",c);hit.addEventListener("pointermove",show);hit.addEventListener("pointerdown",show);hit.addEventListener("pointerleave",()=>{g.style.display="none";tip.hidden=true});
}

/* ================= PLATE CALCULATOR ================= */
const PLATE_COL={25:"#d93d26",20:"#2a63d6",15:"#e0b021",10:"#2f9a5a",5:"#f2f2f2",2.5:"#3a3a3a",1.25:"#b8bcc4",0.5:"#b8bcc4"};
function platesFor(total,bar,avail){
  let side=(total-bar)/2;if(side<0)return null;const out=[];
  for(const p of avail.slice().sort((a,b)=>b-a)){while(side>=p-1e-9){out.push(p);side-=p}}
  return{side:out,rest:Math.round(side*2*100)/100};
}
function plateSheet(w){
  const P=S.prefs,ALL=[25,20,15,10,5,2.5,1.25,0.5];
  sheet("Kalkulator plat",`<div class="field"><label for="plW">Total beban (kg)</label><input type="number" inputmode="decimal" step="any" id="plW" value="${w??""}" placeholder="mis. 80"></div>
  <div class="field"><span class="label">Berat bar</span><div class="seg" id="plBar">${[20,15,10,0].map(k=>`<button data-b="${k}" aria-pressed="${P.bar===k}">${k?k+" kg":"Tanpa bar"}</button>`).join("")}</div></div>
  <div id="plOut"></div>
  <div class="field"><span class="label">Plat yang tersedia di gym</span><div class="seg" id="plAv" style="flex-wrap:wrap">${ALL.map(p=>`<button data-p="${p}" aria-pressed="${P.plates.includes(p)}">${fmt(p,2)}</button>`).join("")}</div><span class="tiny muted">Plat yang disorot berarti tersedia. Ketuk untuk menyalakan atau mematikan.</span></div>`,"",sc=>{
    const draw=()=>{const tw=num($("#plW",sc).value);const o=$("#plOut",sc);
      if(tw==null){o.innerHTML=`<p class="small muted">Isi total beban untuk melihat plat per sisi.</p>`;return}
      const r=platesFor(tw,P.bar,P.plates);
      if(!r){o.innerHTML=`<p class="small">Beban lebih ringan dari bar (${P.bar} kg).</p>`;return}
      const H={25:120,20:112,15:100,10:86,5:66,2.5:52,1.25:44,0.5:36};
      o.innerHTML=`<div class="card pad stack"><div class="eyebrow">Per sisi</div>
        <div class="plviz"><span class="plbar"></span>${r.side.map(p=>`<span class="pl" style="height:${H[p]}px;background:${PLATE_COL[p]};${p===5||p===1.25||p===0.5?"color:#111":""}">${fmt(p,2)}</span>`).join("")}<span class="plcol"></span></div>
        <b class="num" style="font-size:20px">${r.side.length?r.side.map(p=>fmt(p,2)).join(" + "):"Bar kosong"}</b>
        <span class="small muted">${P.bar?"Bar "+P.bar+" kg + ":""}2 × ${fmt(r.side.reduce((a,b)=>a+b,0),2)} kg = ${fmt(tw-r.rest,2)} kg${r.rest?` · kurang ${fmt(r.rest,2)} kg, tidak bisa pas dengan plat yang ada`:""}</span></div>`};
    $("#plW",sc).oninput=draw;
    $$("#plBar [data-b]",sc).forEach(b=>b.onclick=()=>{P.bar=+b.dataset.b;save();$$("#plBar [data-b]",sc).forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
    $$("#plAv [data-p]",sc).forEach(b=>b.onclick=()=>{const p=+b.dataset.p;P.plates=P.plates.includes(p)?P.plates.filter(x=>x!==p):[...P.plates,p];save();const on=P.plates.includes(p);b.setAttribute("aria-pressed",on);draw()});
    draw();
  });
}

/* ================= ROUTINES (templates) ================= */
function tplBlocks(se){return se.blocks.map(b=>({type:b.type,cap:b.cap??null,items:b.items.map(it=>({exId:it.exId,sets:it.sets.map(x=>({k:x.k||"n"}))})).filter(it=>it.sets.length)})).filter(b=>b.items.length)}
function tplStats(t){const n=t.blocks.reduce((a,b)=>a+b.items.length,0),sets=t.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets.length,0),0);return{n,sets}}
function tplLast(t){let l=0;S.sessions.forEach(se=>{if(se.tplId===t.id)l=Math.max(l,se.start)});return l}
function startTpl(t){if(!t)return;if(S.active){toast("Selesaikan sesi yang sedang jalan dulu");location.hash="train";return}startSession({title:t.title,blocks:t.blocks},t.id)}
function tplCard(){
  if(!S.templates.length)return S.sessions.length?`<div class="card pad row" style="gap:12px"><div class="grow"><b>Rutin</b><div class="tiny muted">Simpan susunan latihan favorit, misalnya Push, Pull, Leg, lalu mulai dengan satu ketukan. Buka sesi di Riwayat dan pilih Simpan sebagai rutin.</div></div></div>`:"";

function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return "rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"}

function wrapText(x,t,w,max){const words=t.split(/\s+/);const lines=[];let cur="";words.forEach(wd=>{const n=cur?cur+" "+wd:wd;if(x.measureText(n).width<=w||!cur)cur=n;else{lines.push(cur);cur=wd}});if(cur)lines.push(cur);if(lines.length>max){const keep=lines.slice(0,max);keep[max-1]=fitText(x,lines.slice(max-1).join(" "),w);return keep}return lines.map(l=>fitText(x,l,w))}

function spark(pts){
  if(pts.length<2)return`<p class="muted small">Grafik muncul setelah gerakan ini dicatat di 2 sesi.</p>`;
  const W=600,H=110,P={l:36,r:10,t:10,b:20};
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(hi-lo<1){lo-=1;hi+=1}const pd=(hi-lo)*.12;lo-=pd;hi+=pd;
  const t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(t1-t0,1);
  const x=t=>P.l+(t-t0)/span*(W-P.l-P.r),y=v=>P.t+(hi-v)/(hi-lo)*(H-P.t-P.b);
  const d=pts.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Grafik progres">
  ${[hi-pd,lo+pd].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-5}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--ink-3)">${fmt(v,0)}</text>`).join("")}
  <path d="${d} L${x(last.t)} ${H-P.b} L${P.l} ${H-P.b} Z" fill="var(--accent)" opacity=".1"/>
  <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  <circle cx="${x(last.t)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)"/>
  <text x="${P.l}" y="${H-4}" font-size="11" fill="var(--ink-3)">${fday(t0)}</text><text x="${W-P.r}" y="${H-4}" font-size="11" text-anchor="end" fill="var(--ink-3)">${fday(t1)}</text></svg>`;
}

const redirectUri=()=>location.origin+location.pathname;
async function stravaToken(){
  const s=S.strava;if(!s.refresh)throw new Error("Belum terhubung");
  if(s.access&&s.expires*1000>Date.now()+60000)return s.access;
  const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",body:new URLSearchParams({client_id:s.clientId,client_secret:s.clientSecret,grant_type:"refresh_token",refresh_token:s.refresh})});
  if(!r.ok)throw new Error("Gagal memperbarui token Strava ("+r.status+")");
  const j=await r.json();s.access=j.access_token;s.refresh=j.refresh_token;s.expires=j.expires_at;save();return s.access;
}
async function stravaExchange(code){
  const s=S.strava;
  const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",body:new URLSearchParams({client_id:s.clientId,client_secret:s.clientSecret,code,grant_type:"authorization_code"})});
  if(!r.ok)throw new Error("Strava menolak kode login ("+r.status+"). Cek Client ID dan Secret.");
  const j=await r.json();s.access=j.access_token;s.refresh=j.refresh_token;s.expires=j.expires_at;s.athlete=j.athlete?[j.athlete.firstname,j.athlete.lastname].filter(Boolean).join(" "):"";s.scope=new URLSearchParams(location.search).get("scope")||"";save();
}
async function stravaSync(full){
  const tok=await stravaToken();const s=S.strava;
  const after=Math.floor(((full||!s.lastSync)?Date.now()-120*DAY:s.lastSync-2*DAY)/1000);
  let page=1,added=0;const have=new Set(S.activities.map(a=>a.id));
  while(page<=6){
    const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100&page=${page}`,{headers:{Authorization:"Bearer "+tok}});
    if(r.status===429)throw new Error("Batas permintaan Strava tercapai, coba lagi 15 menit lagi");
    if(!r.ok)throw new Error("Gagal mengambil aktivitas ("+r.status+")");
    const arr=await r.json();if(!arr.length)break;
    arr.forEach(a=>{const o={id:a.id,name:a.name,sport:a.sport_type||a.type,start:Date.parse(a.start_date),moving:a.moving_time,elapsed:a.elapsed_time,distance:a.distance,hr:a.average_heartrate||null,effort:a.suffer_score||null,device:a.device_name||""};
      const i=S.activities.findIndex(x=>x.id===a.id);if(i>-1)S.activities[i]=o;else{S.activities.push(o);added++}});
    if(arr.length<100)break;page++;
  }
  s.lastSync=Date.now();save();return added;
}
/* Send a logged session to Strava. If the Coros already uploaded a strength activity within 2 hours, update that one (keeps HR and calories); otherwise create a manual activity after asking. */
function stravaDesc(se){
  const lines=[];se.blocks.forEach(b=>{const multi=b.type!=="single";if(multi)lines.push((BTYPES[b.type]||BTYPES.single)[0]+(b.cap?" "+b.cap+" menit":"")+":");
    b.items.forEach(it=>{const ex=exById(it.exId)||{mode:"wr"};const ss=it.sets.filter(x=>x.done!==false&&x.k!=="w");if(!ss.length)return;
      const parts=[];ss.forEach(x=>{const t=ex.mode==="wr"?`${fmt(x.w,2)} kg × ${x.r??"–"}`:ex.mode==="r"?`${x.r??"–"} rep${x.w?" +"+fmt(x.w)+" kg":""}`:prevText(x,ex.mode).replace(/<[^>]+>/g,"");const l=parts[parts.length-1];if(l&&l[0]===t)l[1]++;else parts.push([t,1])});
      lines.push((multi?"  ":"")+exName(it.exId)+": "+parts.map(([t,n])=>n>1?t+" ("+n+" set)":t).join(", "))})});

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;

    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}

}

        else if(v.startsWith("lib:")){const lid=v.slice(4),had=S.exercises.some(x=>x.libId===lid);const e=fromLib(lid);if(!had){e.mode=guess(exNames.get(n));const q=hevyEqId(n);if(q)e.eqId=q}v=e.id}

          const set={k:({warmup:"w",failure:"f",dropset:"d"})[get(r,"set_type").toLowerCase()]||"n",w:num(get(r,"weight_kg")),r:num(get(r,"reps")),t:num(get(r,"duration_seconds")),d:num(get(r,"distance_km"))!=null?num(get(r,"distance_km"))*1000:null,e:num(get(r,"rpe")),done:true};
          const bKey=ss?"ss"+ss:"ex"+en;

          let it=cur.b.items.find(x=>x.exId===map[en]);if(!it){it={exId:map[en],note:get(r,"exercise_notes"),sets:[]};cur.b.items.push(it)}

      });

    };
  });
}

function hsh(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(36)+(h1>>>0).toString(36)}
const mon=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
/* Cloud layout: users/{uid}/chunks/{id}, each {j: JSON text, rev, dev}. "core" = gear, exercises, routines, body, prefs; "s-YYYY-MM" = sessions by month; "a-YYYY-MM" = Strava activities by month. The live session and Strava keys stay on the device. */
function chunksOf(st){
  const o={core:JSON.stringify({equipment:st.equipment,exercises:st.exercises,templates:st.templates,body:st.body,prefs:st.prefs})};
  const g={};st.sessions.forEach(x=>{(g["s-"+mon(x.start)]=g["s-"+mon(x.start)]||[]).push(x)});(st.activities||[]).forEach(x=>{(g["a-"+mon(x.start)]=g["a-"+mon(x.start)]||[]).push(x)});
  Object.keys(g).forEach(k=>o[k]=JSON.stringify(g[k]));return o;
}
function applyChunk(st,id,j){
  if(id==="core"){const c=JSON.parse(j);["equipment","exercises","templates","body","prefs"].forEach(k=>{if(c[k]!=null)st[k]=c[k]});return}
  const k=id[0]==="s"?"sessions":id[0]==="a"?"activities":null;if(!k)return;
  const m=id.slice(2),list=j?JSON.parse(j):[];
  st[k]=st[k].filter(x=>mon(x.start)!==m).concat(list).sort((a,b)=>a.start-b.start);
}
function loadFB(){
  if(FBP)return FBP;
  FBP=new Promise((res,rej)=>{if(window.GHFB){window.GHFB.init(FB_CFG);return res(window.GHFB)}const sc=document.createElement("script");sc.src="fb.js";sc.onload=()=>{try{window.GHFB.init(FB_CFG);res(window.GHFB)}catch(e){rej(e)}};sc.onerror=()=>{FBP=null;rej(new Error("Modul login gagal dimuat. Cek koneksi."))};document.head.appendChild(sc)});
  return FBP;
}
function setSync(st,err){SST={st,at:st==="ok"?Date.now():SST.at,err:err||""};const el=$("#syncSt");if(el)el.innerHTML=syncLabel()}
function syncLabel(){const{st,at,err}=SST;if(st==="busy")return"Menyinkronkan…";if(st==="err")return`<span style="color:var(--accent)">${esc(err||"Gagal sinkron")}</span>`;if(st==="offline")return"Offline. Perubahan dikirim saat online lagi.";if(st==="ok")return`Tersinkron ${ftime(at)}`;return"Menyambung…"}
function syncSoon(){if(!CU||!SY.ready)return;clearTimeout(syncT);syncT=setTimeout(pushAll,1500)}
async function pushAll(){
  if(!CU||!SY.ready)return;const fb=window.GHFB;if(!fb)return;
  if(!navigator.onLine){setSync("offline");return}
  const ch=chunksOf(S),jobs=[];SY.hash=SY.hash||{};
  Object.keys(ch).forEach(id=>{const h=hsh(ch[id]);if(SY.hash[id]!==h)jobs.push([id,ch[id],h])});
  const gone=Object.keys(SY.hash).filter(id=>!(id in ch));
  if(!jobs.length&&!gone.length){setSync("ok");return}
  setSync("busy");
  try{
    for(const [id,j,h] of jobs){await fb.put(CU.uid,id,{j,rev:Date.now(),dev:DEV});SY.hash[id]=h}
    for(const id of gone){await fb.del(CU.uid,id);delete SY.hash[id]}
    sySave();setSync("ok");
  }catch(e){sySave();setSync(navigator.onLine?"err":"offline",e&&e.code==="permission-denied"?"Ditolak Firestore. Cek aturan keamanan.":"Gagal sinkron, dicoba lagi nanti");clearTimeout(syncT);syncT=setTimeout(pushAll,30000)}
}
window.addEventListener("online",()=>syncSoon());
function onRemote(changes){
  let hit=false;
  changes.forEach(c=>{
    if(c.type==="removed"){if(!(c.id in (SY.hash||{})))return;delete SY.hash[c.id];applyChunk(S,c.id,"");hit=true;return}
    const j=c.data&&c.data.j;if(typeof j!=="string")return;const h=hsh(j);if(SY.hash[c.id]===h)return;
    try{applyChunk(S,c.id,j);SY.hash[c.id]=h;hit=true}catch(e){}
  });
  if(!hit)return;
  sySave();VER++;clearTimeout(saveT);saveT=setTimeout(saveNow,250);setSync("ok");
  const busy=$("#scrim")||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));

function startWatch(){if(unwatch)unwatch();unwatch=window.GHFB.watch(CU.uid,onRemote,e=>setSync("err",e&&e.code==="permission-denied"?"Ditolak Firestore. Cek aturan keamanan.":"Koneksi sinkron terputus"))}
const hasData=st=>st.sessions.length+st.templates.length+st.body.length>0;
function mergeStates(cloud,local){
  const m=JSON.parse(JSON.stringify(cloud)),L=JSON.parse(JSON.stringify(local));const low=x=>(x||"").trim().toLowerCase();
  const eqMap={};L.equipment.forEach(e=>{const c=m.equipment.find(x=>x.id===e.id)||m.equipment.find(x=>low(x.name)===low(e.name));if(c)eqMap[e.id]=c.id;else m.equipment.push(e)});
  const exMap={};L.exercises.forEach(e=>{const c=m.exercises.find(x=>x.id===e.id)||m.exercises.find(x=>low(x.name)===low(e.name)&&x.mode===e.mode);if(c)exMap[e.id]=c.id;else{e.eqId=eqMap[e.eqId]||e.eqId;m.exercises.push(e)}});
  const fix=bl=>bl.forEach(b=>b.items.forEach(it=>it.exId=exMap[it.exId]||it.exId));
  L.sessions.forEach(x=>{if(m.sessions.some(y=>y.id===x.id||(x.hevyKey&&y.hevyKey===x.hevyKey)))return;fix(x.blocks);m.sessions.push(x)});
  L.templates.forEach(x=>{if(m.templates.some(y=>y.id===x.id))return;fix(x.blocks);m.templates.push(x)});
  L.body.forEach(x=>{if(!m.body.some(y=>y.id===x.id))m.body.push(x)});
  (L.activities||[]).forEach(x=>{if(!m.activities.some(y=>y.id===x.id))m.activities.push(x)});
  m.sessions.sort((a,b)=>a.start-b.start);return m;
}
async function firstSync(u){

  `<button class="btn grow" id="mgCloud">Pakai data akun saja</button><button class="btn btn-primary grow" id="mgYes">Gabungkan</button>`,sc=>{
    $("#mgYes",sc).onclick=()=>{closeSheet();done(mergeStates(cloud,S),known);toast("Data digabung");res()};
    $("#mgCloud",sc).onclick=()=>{closeSheet();done(cloud,known);toast("Data dari akun Google dimuat");res()};
  }));
}
