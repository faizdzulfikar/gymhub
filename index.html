<style>
/* Layout: one phone-width column (max 560px) with a fixed bottom tab bar; sheets slide up from the bottom.
   Accent is bumper-plate red; plate blue/yellow/green mark set types and block types. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f4f5f8; --line:#dde1e7; --line-strong:#c3c9d2;
  --ink:#151920; --ink-2:#48505d; --ink-3:#7a8391;
  --accent:#d6402a; --accent-ink:#ffffff; --accent-soft:#fbe5e1;
  --blue:#2a63c9; --blue-soft:#e3ebfa; --yellow:#c99a06; --yellow-soft:#fbf2d6; --green:#23874f; --green-soft:#dff2e7;
  --done:#e5f4eb; --scrim:rgba(10,12,16,.45);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#181c22; --surface-2:#1f242b; --line:#2a3039; --line-strong:#3a414c;
  --ink:#eef0f3; --ink-2:#b5bcc7; --ink-3:#808a98;
  --accent:#f0583f; --accent-ink:#ffffff; --accent-soft:#3a1f1a;
  --blue:#6c9bf0; --blue-soft:#1b2840; --yellow:#e7bb3c; --yellow-soft:#342b12; --green:#4fc184; --green-soft:#16301f;
  --done:#15291d; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#181c22; --surface-2:#1f242b; --line:#2a3039; --line-strong:#3a414c;
  --ink:#eef0f3; --ink-2:#b5bcc7; --ink-3:#808a98;
  --accent:#f0583f; --accent-ink:#ffffff; --accent-soft:#3a1f1a;
  --blue:#6c9bf0; --blue-soft:#1b2840; --yellow:#e7bb3c; --yellow-soft:#342b12; --green:#4fc184; --green-soft:#16301f;
  --done:#15291d; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

.app{max-width:560px;margin:0 auto;padding-block:12px calc(150px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.brand span{color:var(--accent)}
.brand svg{width:30px;height:30px}
h1{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:16px;margin:0;font-weight:700}
.muted{color:var(--ink-3)} .small{font-size:14px} .tiny{font-size:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-danger{background:transparent;border-color:transparent;color:var(--accent)}
.btn-block{width:100%}
.btn-lg{min-height:56px;font-size:18px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.icon{width:44px;padding:0}
.icon svg{width:20px;height:20px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 12px;min-width:0;font-size:16px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.red{background:var(--accent-soft);color:var(--accent)} .chip.blue{background:var(--blue-soft);color:var(--blue)} .chip.yellow{background:var(--yellow-soft);color:var(--yellow)} .chip.green{background:var(--green-soft);color:var(--green)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.empty{text-align:center;padding:28px 16px;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink-3);text-decoration:none;letter-spacing:.02em}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--accent)}

/* Home */
.hero{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.hero .eyebrow{color:inherit;opacity:.7}
.hero h1{color:inherit}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;opacity:.75}
.week i{display:block;width:100%;aspect-ratio:1;max-width:34px;border-radius:50%;border:2px solid currentColor;opacity:.4}
.week i.on{background:var(--accent);border-color:var(--accent);opacity:1}
.week i.today{opacity:1}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit;text-decoration:none;min-height:56px}
.item:first-child{border-top:0}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--ink-3)}
.item .r{margin-left:auto;text-align:right;flex:none}
.big{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}

/* Active session */
.sess-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:8px;margin-block:-8px 0;display:flex;align-items:center;gap:8px}
.sess-title{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;border:0;background:transparent;padding:0;min-height:36px;width:100%}
.sess-title:focus{box-shadow:none;border-bottom:2px solid var(--accent);border-radius:0}
.clock{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink-2)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
.stats3 b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1}
.stats3 span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.block-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.block-head .grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bx{padding:12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.bx:first-of-type{border-top:0}
.bx-name{display:flex;align-items:center;gap:8px}
.bx-name button.link{border:0;background:none;padding:0;font-weight:700;font-size:17px;color:var(--accent);text-align:left}
.sets{display:flex;flex-direction:column;gap:4px}
.set{display:grid;grid-template-columns:36px minmax(0,1.1fr) var(--cols) 48px;gap:6px;align-items:center;padding:3px 4px;border-radius:var(--r-sm)}
.set.head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-block:0}
.set.head span{text-align:center}
.set.done{background:var(--done)}
.set input{text-align:center;min-height:40px;padding:4px 6px;font-weight:600;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--ink-3);font-weight:500}
.set.done input{background:transparent;border-color:transparent}
.sidx{height:36px;border-radius:6px;border:0;background:var(--surface-2);font-weight:800;font-size:14px;color:var(--ink-2)}
.sidx.w{background:var(--yellow-soft);color:var(--yellow)} .sidx.f{background:var(--accent-soft);color:var(--accent)} .sidx.d{background:var(--blue-soft);color:var(--blue)}
.prev{font-size:13px;color:var(--ink-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{height:40px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}
.check svg{width:20px;height:20px;opacity:.35}
.set.done .check{background:var(--green);border-color:var(--green);color:#fff}
.set.done .check svg{opacity:1}
.bx-actions{display:flex;gap:6px;flex-wrap:wrap}
.blockmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}

/* Rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.rest-in{max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.rest-in .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.rest-in b{font-family:var(--f-display);font-size:28px;line-height:1;min-width:70px}
.rest-in button{min-height:40px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;padding:0 10px;font-weight:700}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(92vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1}
.sheet-body{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.pick{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-height:52px}
.pick .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center}
.pick[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:#fff}
.pick .box svg{width:16px;height:16px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.modes button{min-height:52px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);text-align:left;padding:6px 10px;font-size:14px;font-weight:700;line-height:1.2}
.modes button small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.spark{width:100%;height:110px;display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px}
.kv b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.kv span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>

<script>
(function(){
"use strict";
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmt=(n,d=1)=>n==null||!isFinite(n)?"–":Number(n).toLocaleString("id-ID",{maximumFractionDigits:d});
const pad2=n=>String(n).padStart(2,"0");
const dur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad2(m)}:${pad2(x)}`:`${m}:${pad2(x)}`};
const durWords=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)} j ${m%60} m`:`${m} m`};
const fday=t=>new Date(t).toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"});
const fdate=t=>new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const ftime=t=>new Date(t).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};

const MODES={
  wr:{name:"Beban × rep",ex:"Bench press, mesin",cols:[["w","kg"],["r","rep"]]},
  r:{name:"Rep saja",ex:"Push up, pull up",cols:[["r","rep"],["w","+kg"]]},
  t:{name:"Waktu",ex:"Plank, wall sit",cols:[["t","detik"]]},
  wt:{name:"Beban × waktu",ex:"Farmer carry",cols:[["w","kg"],["t","detik"]]},
  dt:{name:"Jarak × waktu",ex:"Sled, rowing",cols:[["d","meter"],["t","detik"]]}
};
const KINDS={barbel:"Barbel",dumbel:"Dumbel",mesin:"Mesin",kabel:"Kabel",kettlebell:"Kettlebell",mat:"Mat / lantai",bodyweight:"Tanpa alat",lainnya:"Lainnya"};
const BTYPES={single:["Set biasa",""],superset:["Superset","blue"],circuit:["Circuit","green"],emom:["EMOM","yellow"],amrap:["AMRAP","red"],tabata:["Tabata","red"]};
const SETK={n:"",w:"W",f:"F",d:"D"};const SETK_NAME={n:"Set biasa",w:"Pemanasan",f:"Sampai gagal",d:"Drop set"};

/* ================= storage (IndexedDB, fallback localStorage) ================= */
const DBN="gymhub",KEY="state-v1";
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadStore(){
  try{const db=await idb();const v=await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(v)return v}catch(e){}
  try{const s=localStorage.getItem("gymhub."+KEY);if(s)return JSON.parse(s)}catch(e){}
  return null;
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
async function saveNow(){
  const data=JSON.parse(JSON.stringify(S));
  try{const db=await idb();db.transaction("kv","readwrite").objectStore("kv").put(data,KEY);return}catch(e){}
  try{localStorage.setItem("gymhub."+KEY,JSON.stringify(data))}catch(e){}
}
window.addEventListener("pagehide",()=>{clearTimeout(saveT);saveNow()});
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(saveT);saveNow()}});

    ex("Incline DB press","e-db","wr","Dada"),ex("DB lateral raise","e-db","wr","Bahu",60),ex("DB curl","e-db","wr","Biseps",60),ex("Goblet squat","e-kb","wr","Paha"),ex("Kettlebell swing","e-kb","wr","Posterior chain",60),
    ex("Lat pulldown","e-lat","wr","Punggung"),ex("Leg press","e-lp","wr","Paha"),ex("Cable row","e-cb","wr","Punggung"),ex("Triceps pushdown","e-cb","wr","Triseps",60),
    ex("Pull up","e-bw","r","Punggung"),ex("Push up","e-bw","r","Dada",60),ex("Burpee","e-bw","r","Seluruh tubuh",45),ex("Walking lunge","e-db","wr","Paha"),
    ex("Plank","e-mat","t","Core",45),ex("Side plank","e-mat","t","Core",30),ex("Hollow hold","e-mat","t","Core",45),ex("Mountain climber","e-mat","t","Core",30),ex("Dead bug","e-mat","r","Core",45),ex("Glute bridge","e-mat","r","Glutes",45),ex("Bird dog","e-mat","r","Core",30),
    ex("Farmer carry","e-db","wt","Grip",90),ex("Sled push","e-sled","dt","Seluruh tubuh",120),ex("Rowing","e-row","dt","Kardio",60)
  ];
  return {v:1,equipment,exercises,sessions:[],active:null,prefs:{rest:90}};

let S=null;

/* ================= derived ================= */
const exById=id=>S.exercises.find(e=>e.id===id);
const eqById=id=>S.equipment.find(e=>e.id===id);
const exName=id=>(exById(id)||{name:"(gerakan dihapus)"}).name;
function setVol(s,mode){return (mode==="wr"||mode==="r")&&s.w&&s.r?s.w*s.r:0}
function sessionStats(se){let sets=0,vol=0;se.blocks.forEach(b=>b.items.forEach(it=>{const m=(exById(it.exId)||{}).mode;it.sets.forEach(s=>{if(s.done){sets++;vol+=setVol(s,m)}})}));return{sets,vol}}
function prevSetsFor(exId,excludeId){
  const ss=S.sessions.slice().sort((a,b)=>b.start-a.start);
  for(const se of ss){if(se.id===excludeId)continue;for(const b of se.blocks)for(const it of b.items)if(it.exId===exId&&it.sets.some(s=>s.done))return it.sets.filter(s=>s.done)}
  return [];
}
function prevText(s,mode){if(!s)return"–";if(mode==="wr")return`${fmt(s.w)}×${s.r??"–"}`;if(mode==="r")return`${s.r??"–"}${s.w?` +${fmt(s.w)}`:""}`;if(mode==="t")return`${s.t??"–"} dtk`;if(mode==="wt")return`${fmt(s.w)}kg ${s.t??"–"}d`;if(mode==="dt")return`${fmt(s.d,0)}m ${s.t??"–"}d`;return"–"}
const e1rm=(w,r)=>w&&r&&r<=12?(r===1?w:w*(1+r/30)):null;
function exHistory(exId){
  const out=[];
  S.sessions.slice().sort((a,b)=>a.start-b.start).forEach(se=>{const sets=[];se.blocks.forEach(b=>b.items.forEach(it=>{if(it.exId===exId)it.sets.forEach(s=>{if(s.done&&s.k!=="w")sets.push(s)})}));if(sets.length)out.push({se,sets})});
  return out;
}
function bestOf(mode,sets){
  if(mode==="wr")return Math.max(0,...sets.map(s=>e1rm(s.w,s.r)||s.w||0));
  if(mode==="r")return Math.max(0,...sets.map(s=>s.r||0));
  if(mode==="t"||mode==="wt")return Math.max(0,...sets.map(s=>s.t||0));
  if(mode==="dt")return Math.max(0,...sets.map(s=>s.d||0));return 0;
}

/* ================= ui helpers ================= */
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function sheet(title,body,foot,onMount){
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="btn btn-ghost icon" data-close aria-label="Tutup"><svg><use href="#i-x"/></svg></button></div><div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:""}</div></div>`;
  const sc=$("#scrim");sc.addEventListener("click",e=>{if(e.target===sc||e.target.closest("[data-close]"))closeSheet()});
  onMount&&onMount(sc);
}
function closeSheet(){$("#sheetRoot").innerHTML=""}
function confirmSheet(title,msg,ok,fn){sheet(title,`<p style="margin:0">${esc(msg)}</p>`,`<button class="btn grow" data-close>Batal</button><button class="btn btn-primary grow" id="okC">${esc(ok)}</button>`,sc=>{$("#okC",sc).onclick=()=>{closeSheet();fn()}})}
const top=(title,back)=>`<div class="top">${back?`<a class="btn btn-ghost icon" href="${back}" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>`:`<div class="brand"><svg><use href="#i-logo"/></svg>Gym<span>Hub</span></div>`}${title?`<h2 class="grow" style="text-align:${back?"left":"right"}">${esc(title)}</h2>`:""}</div>`;

/* ================= router ================= */
let tick=null;
function route(){
  clearInterval(tick);tick=null;
  const h=(location.hash||"#train").slice(1);
  let v="train",arg=null;
  if(h.startsWith("session-")){v="session";arg=h.slice(8)}
  else if(h.startsWith("ex-")){v="exercise";arg=h.slice(3)}
  else if(["train","history","exercises","more"].includes(h))v=h;
  const tab=v==="session"?"history":v==="exercise"?"exercises":v;
  $$("#tabs a").forEach(a=>a.dataset.tab===tab?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  ({train:renderTrain,history:renderHistory,session:renderSession,exercises:renderExercises,exercise:renderExercise,more:renderMore})[v](arg);
}

/* ================= TRAIN ================= */
function renderTrain(){ if(S.active)return renderActive(); renderHome() }
function renderHome(){
  const now=new Date(),mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const done=new Set(S.sessions.map(s=>dayKey(s.start)));
  const days=["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map((d,i)=>{const t=new Date(mon);t.setDate(mon.getDate()+i);return`<div><i class="${done.has(dayKey(t))?"on":""} ${dayKey(t)===dayKey(now)?"today":""}"></i>${d}</div>`}).join("");
  const thisWeek=S.sessions.filter(s=>s.start>=mon.getTime()).length;
  const recent=S.sessions.slice().sort((a,b)=>b.start-a.start).slice(0,4);
  $("#view").innerHTML=`${top()}
  <section class="hero"><div><div class="eyebrow">Minggu ini</div><h1>${thisWeek} sesi</h1></div><div class="week">${days}</div>
  <button class="btn btn-primary btn-lg btn-block" id="startBtn">Mulai latihan</button></section>
  <div class="row between"><h2>Ulangi sesi</h2>${recent.length?`<a class="btn btn-ghost btn-sm" href="#history">Semua</a>`:""}</div>
  <div class="card list">${recent.map(se=>{const st=sessionStats(se);return`<button class="item" data-repeat="${se.id}"><div class="grow"><div class="t">${esc(se.title)}</div><div class="s">${fday(se.start)} · ${se.blocks.reduce((a,b)=>a+b.items.length,0)} gerakan · ${st.sets} set</div></div><span class="chip red">Ulangi</span></button>`}).join("")||`<div class="empty"><strong>Belum ada sesi</strong>Mulai sesi pertama, atau impor riwayat Hevy di tab Lainnya.</div>`}</div>`;
  $("#startBtn").onclick=()=>startSession();
  $$("[data-repeat]").forEach(b=>b.onclick=()=>startSession(S.sessions.find(s=>s.id===b.dataset.repeat)));
}
function startSession(from){
  const h=new Date().getHours();
  const title=from?from.title:(h<11?"Latihan pagi":h<15?"Latihan siang":h<18?"Latihan sore":"Latihan malam");
  S.active={id:uid(),title,start:Date.now(),note:"",blocks:from?from.blocks.map(b=>({id:uid(),type:b.type,cap:b.cap??null,rounds:null,items:b.items.map(it=>({exId:it.exId,note:"",sets:it.sets.map(s=>({k:s.k||"n",w:null,r:null,t:null,d:null,done:false}))}))})):[]};
  save();location.hash="train";route();
}
function renderActive(){
  const se=S.active;
  const st=sessionStats(se);
  $("#view").innerHTML=`
  <div class="sess-head"><input class="sess-title grow" id="sTitle" value="${esc(se.title)}" aria-label="Nama sesi"><span class="clock num" id="clock">${dur((Date.now()-se.start)/1000)}</span><button class="btn btn-primary btn-sm" id="finish">Selesai</button></div>
  <div class="stats3"><div><b class="num" id="stSets">${st.sets}</b><span>Set selesai</span></div><div><b class="num" id="stVol">${fmt(st.vol,0)}</b><span>Volume kg</span></div><div><b class="num">${se.blocks.reduce((a,b)=>a+b.items.length,0)}</b><span>Gerakan</span></div></div>
  <div id="blocks" class="stack" style="gap:12px">${se.blocks.map(renderBlock).join("")||`<div class="card empty"><strong>Sesi sudah jalan</strong>Tambah gerakan pertama. Bisa angkat beban, kerja di mat, atau circuit.</div>`}</div>
  <div class="row"><button class="btn btn-soft grow" id="addEx">＋ Gerakan</button><button class="btn grow" id="addCircuit">＋ Circuit / superset</button></div>
  <div class="field"><label for="sNote">Catatan sesi</label><textarea id="sNote" placeholder="Energi, tidur, keluhan…">${esc(se.note||"")}</textarea></div>
  <button class="btn btn-danger" id="discard">Buang sesi ini</button>`;
  tick=setInterval(()=>{const c=$("#clock");if(c)c.textContent=dur((Date.now()-se.start)/1000)},1000);
  $("#sTitle").oninput=e=>{se.title=e.target.value;save()};
  $("#sNote").oninput=e=>{se.note=e.target.value;save()};
  $("#addEx").onclick=()=>pickExercises("single");
  $("#addCircuit").onclick=()=>pickExercises("circuit");
  $("#finish").onclick=finishSession;
  $("#discard").onclick=()=>confirmSheet("Buang sesi?","Semua set di sesi ini akan dihapus dan tidak masuk riwayat.","Buang",()=>{S.active=null;stopRest();save();route()});
  bindBlocks();
}
function renderBlock(b){
  const [label,color]=BTYPES[b.type]||BTYPES.single;
  const multi=b.type!=="single";
  return `<section class="block" data-b="${b.id}">
    ${multi?`<div class="block-head"><div class="grow"><span class="chip ${color}">${label}</span>${b.type==="tabata"?'<span class="small muted">8 ronde · 20 dtk kerja / 10 dtk istirahat</span>':""}</div><button class="btn btn-ghost icon" data-bmenu="${b.id}" aria-label="Opsi blok"><svg><use href="#i-dots"/></svg></button></div>
    ${["emom","amrap"].includes(b.type)?`<div class="blockmeta"><div class="field"><label>Durasi (menit)</label><input type="number" inputmode="numeric" data-bf="cap" value="${b.cap??""}" placeholder="${b.type==="emom"?"10":"12"}"></div><div class="field"><label>${b.type==="amrap"?"Ronde selesai":"Menit selesai"}</label><input type="number" inputmode="numeric" data-bf="rounds" value="${b.rounds??""}"></div></div>`:""}`:""}
    ${b.items.map((it,i)=>renderItem(b,it,i)).join("")}
    ${multi?`<div class="bx"><div class="bx-actions"><button class="btn btn-soft btn-sm grow" data-round="${b.id}">＋ Ronde (semua gerakan)</button><button class="btn btn-sm" data-addto="${b.id}">＋ Gerakan ke blok</button></div></div>`:""}
  </section>`;
}
function renderItem(b,it,i){
  const ex=exById(it.exId)||{name:"(gerakan dihapus)",mode:"wr"};const M=MODES[ex.mode]||MODES.wr;
  const prev=prevSetsFor(it.exId,S.active&&S.active.id);
  const cols=M.cols.map(()=> "minmax(0,1fr)").join(" ");
  const eq=eqById(ex.eqId);
  return `<div class="bx" data-i="${i}">
    <div class="bx-name"><button class="link grow" data-exinfo="${it.exId}">${esc(ex.name)}</button>${eq?`<span class="chip">${esc(eq.name)}</span>`:""}<button class="btn btn-ghost icon" data-imenu="${b.id}:${i}" aria-label="Opsi gerakan"><svg><use href="#i-dots"/></svg></button></div>
    ${it.note?`<div class="small muted">${esc(it.note)}</div>`:""}
    <div class="sets" style="--cols:${cols}">
      <div class="set head"><span>Set</span><span>Sebelumnya</span>${M.cols.map(c=>`<span>${c[1]}</span>`).join("")}<span></span></div>
      ${it.sets.map((s,j)=>{const p=prev[j]||prev[prev.length-1];return `<div class="set ${s.done?"done":""}" data-j="${j}">
        <button class="sidx ${s.k&&s.k!=="n"?s.k:""}" data-kind aria-label="Jenis set: ${SETK_NAME[s.k||"n"]}">${SETK[s.k||"n"]||j+1-it.sets.slice(0,j).filter(x=>x.k==="w").length}</button>
        <span class="prev num">${p?prevText(p,ex.mode):"–"}</span>
        ${M.cols.map(([f])=>`<input type="number" inputmode="decimal" step="any" data-f="${f}" value="${s[f]??""}" placeholder="${p&&p[f]!=null?p[f]:""}" aria-label="${f}">`).join("")}
        <button class="check" data-done aria-label="Tandai set selesai" aria-pressed="${!!s.done}"><svg><use href="#i-check"/></svg></button>
      </div>`}).join("")}
    </div>
    <div class="bx-actions"><button class="btn btn-sm grow" data-addset>＋ Set</button>${it.sets.length?`<button class="btn btn-ghost btn-sm" data-delset>Hapus set terakhir</button>`:""}</div>
  </div>`;
}
function findB(id){return S.active.blocks.find(b=>b.id===id)}
function bindBlocks(){
  const root=$("#blocks");
  root.addEventListener("input",e=>{
    const inp=e.target;
    if(inp.dataset.bf){const b=findB(inp.closest("[data-b]").dataset.b);b[inp.dataset.bf]=num(inp.value);save();return}
    if(!inp.dataset.f)return;
    const b=findB(inp.closest("[data-b]").dataset.b),it=b.items[+inp.closest("[data-i]").dataset.i],s=it.sets[+inp.closest("[data-j]").dataset.j];
    s[inp.dataset.f]=num(inp.value);save();updStats();
  });
  root.addEventListener("click",e=>{
    const t=e.target.closest("button");if(!t)return;
    const bEl=t.closest("[data-b]");const b=bEl&&findB(bEl.dataset.b);
    const iEl=t.closest("[data-i]");const it=b&&iEl?b.items[+iEl.dataset.i]:null;
    const jEl=t.closest("[data-j]");const j=jEl?+jEl.dataset.j:null;
    if(t.hasAttribute("data-done")){
      const s=it.sets[j],ex=exById(it.exId)||{mode:"wr"};
      if(!s.done){const prev=prevSetsFor(it.exId,S.active.id);const p=prev[j]||prev[prev.length-1]||(j>0?it.sets[j-1]:null);
        MODES[ex.mode].cols.forEach(([f])=>{if(s[f]==null&&p&&p[f]!=null)s[f]=p[f]});
        const need=MODES[ex.mode].cols[0][0];if(s[need]==null&&ex.mode!=="r"){toast("Isi angkanya dulu");jEl.querySelector("input").focus();return}
        if(ex.mode==="r"&&s.r==null){toast("Isi jumlah rep dulu");jEl.querySelector("input").focus();return}
        s.done=true;s.at=Date.now();buzz(15);
        const lastInRound=b.type==="single"||(b.type==="superset"&&+iEl.dataset.i===b.items.length-1);
        if(lastInRound&&s.k!=="w")startRest(ex.rest??S.prefs.rest);
      }else s.done=false;
      save();rerenderBlock(b);updStats();return;
    }
    if(t.hasAttribute("data-kind")){const s=it.sets[j];const order=["n","w","f","d"];s.k=order[(order.indexOf(s.k||"n")+1)%4];toast(SETK_NAME[s.k]);save();rerenderBlock(b);return}
    if(t.hasAttribute("data-addset")){const last=it.sets[it.sets.length-1];it.sets.push({k:"n",w:last?last.w:null,r:last?last.r:null,t:last?last.t:null,d:last?last.d:null,done:false});save();rerenderBlock(b);return}
    if(t.hasAttribute("data-delset")){it.sets.pop();save();rerenderBlock(b);updStats();return}
    if(t.dataset.round){b.items.forEach(x=>{const l=x.sets[x.sets.length-1];x.sets.push({k:"n",w:l?l.w:null,r:l?l.r:null,t:l?l.t:null,d:l?l.d:null,done:false})});save();rerenderBlock(b);return}
    if(t.dataset.addto){pickExercises("into:"+b.id);return}
    if(t.dataset.exinfo){exQuick(t.dataset.exinfo);return}
    if(t.dataset.imenu){itemMenu(b,+t.dataset.imenu.split(":")[1]);return}
    if(t.dataset.bmenu){blockMenu(b);return}
  });
}
function rerenderBlock(b){const el=$(`[data-b="${b.id}"]`);if(!el)return renderActive();const y=window.scrollY;el.outerHTML=renderBlock(b);window.scrollTo(0,y)}
function updStats(){const st=sessionStats(S.active);const a=$("#stSets"),v=$("#stVol");if(a)a.textContent=st.sets;if(v)v.textContent=fmt(st.vol,0)}
function itemMenu(b,i){
  const it=b.items[i],ex=exById(it.exId);
  sheet(ex?ex.name:"Gerakan",`<div class="field"><label for="iNote">Catatan untuk gerakan ini</label><input type="text" id="iNote" value="${esc(it.note||"")}" placeholder="mis. pin di lubang 5"></div>
  ${ex?`<div class="field"><label for="iRest">Istirahat (detik)</label><input type="number" inputmode="numeric" id="iRest" value="${ex.rest??S.prefs.rest}"></div>`:""}
  <div class="stack"><button class="btn" id="iUp" ${i===0&&S.active.blocks[0]===b?"disabled":""}>Pindah ke atas</button><button class="btn" id="iSwap">Ganti gerakan</button><button class="btn btn-danger" id="iDel">Hapus dari sesi</button></div>`,
  `<button class="btn btn-primary btn-block" id="iSave">Simpan</button>`,sc=>{
    $("#iSave",sc).onclick=()=>{it.note=$("#iNote").value.trim();if(ex&&$("#iRest"))ex.rest=num($("#iRest").value)??ex.rest;save();closeSheet();rerenderBlock(b)};
    $("#iDel",sc).onclick=()=>{b.items.splice(i,1);if(!b.items.length)S.active.blocks=S.active.blocks.filter(x=>x!==b);save();closeSheet();renderActive()};
    $("#iSwap",sc).onclick=()=>{closeSheet();pickExercises("swap:"+b.id+":"+i)};
    $("#iUp",sc).onclick=()=>{const bl=S.active.blocks;if(b.type!=="single"&&i>0){[b.items[i-1],b.items[i]]=[b.items[i],b.items[i-1]]}else{const k=bl.indexOf(b);if(k>0)[bl[k-1],bl[k]]=[bl[k],bl[k-1]]}save();closeSheet();renderActive()};
  });
}
function blockMenu(b){
  sheet("Opsi blok",`<div class="field"><span class="label">Jenis blok</span><div class="seg">${Object.entries(BTYPES).filter(([k])=>k!=="single").map(([k,[l]])=>`<button data-bt="${k}" aria-pressed="${b.type===k}">${l}</button>`).join("")}</div></div>
  <button class="btn btn-danger" id="bDel">Hapus blok</button>`,"",sc=>{
    $$("[data-bt]",sc).forEach(x=>x.onclick=()=>{b.type=x.dataset.bt;save();closeSheet();renderActive()});
    $("#bDel",sc).onclick=()=>{S.active.blocks=S.active.blocks.filter(x=>x!==b);save();closeSheet();renderActive()};
  });
}
function exQuick(id){
  const ex=exById(id);if(!ex)return;const h=exHistory(id).slice(-5).reverse();
  sheet(ex.name,`<div class="small muted">${esc(MODES[ex.mode].name)}${eqById(ex.eqId)?" · "+esc(eqById(ex.eqId).name):""}${ex.muscle?" · "+esc(ex.muscle):""}</div>
  ${h.length?`<table><thead><tr><th>Tanggal</th><th>Set</th></tr></thead>${h.map(x=>`<tr><td style="white-space:nowrap">${fday(x.se.start)}</td><td class="num">${x.sets.map(s=>prevText(s,ex.mode)).join(", ")}</td></tr>`).join("")}</table>`:`<p class="muted" style="margin:0">Belum ada riwayat untuk gerakan ini.</p>`}`,"");
}

/* ---------- exercise picker ---------- */
function pickExercises(mode){
  const sel=[];let q="",creating=false;
  const multi=mode==="circuit"||mode.startsWith("into:")||mode==="single";
  const isSwap=mode.startsWith("swap:");
  const recentIds=[];S.sessions.slice().sort((a,b)=>b.start-a.start).forEach(se=>se.blocks.forEach(b=>b.items.forEach(it=>{if(!recentIds.includes(it.exId))recentIds.push(it.exId)})));
  sheet(isSwap?"Ganti gerakan":mode==="circuit"?"Pilih gerakan untuk circuit":"Tambah gerakan",
    `<input type="search" id="pq" placeholder="Cari atau ketik nama gerakan baru…" autocomplete="off" aria-label="Cari gerakan"><div id="plist"></div>`,
    `<div class="grow stack" style="gap:8px">${mode==="circuit"?`<div class="seg" id="ptype">${["superset","circuit","emom","amrap","tabata"].map(k=>`<button data-t="${k}" aria-pressed="${k==="circuit"}">${BTYPES[k][0]}</button>`).join("")}</div>`:""}<button class="btn btn-primary btn-block" id="padd" disabled>Pilih gerakan</button></div>`,
    sc=>{
      let btype="circuit";
      const draw=()=>{
        if(creating)return;
        const ql=q.trim().toLowerCase();
        let list=S.exercises.filter(e=>!e.archived&&(!ql||e.name.toLowerCase().includes(ql)||(eqById(e.eqId)||{name:""}).name.toLowerCase().includes(ql)));
        list.sort((a,b)=>{const ra=recentIds.indexOf(a.id),rb=recentIds.indexOf(b.id);if(!ql&&(ra>-1||rb>-1))return(ra<0?1e9:ra)-(rb<0?1e9:rb);return a.name.localeCompare(b.name)});
        const exact=S.exercises.some(e=>e.name.toLowerCase()===ql);
        $("#plist",sc).innerHTML=(ql&&!exact?`<button class="pick" id="pnew"><span class="box" style="border-color:var(--accent);color:var(--accent)">＋</span><span class="grow"><b>Buat “${esc(q.trim())}”</b><div class="small muted">Gerakan atau alat yang belum ada</div></span></button>`:"")
          +list.map(e=>`<button class="pick" data-id="${e.id}" aria-pressed="${sel.includes(e.id)}"><span class="box"><svg><use href="#i-check"/></svg></span><span class="grow"><b>${esc(e.name)}</b><div class="small muted">${esc((eqById(e.eqId)||{}).name||"")} · ${MODES[e.mode].name}</div></span>${sel.includes(e.id)?`<span class="chip red">${sel.indexOf(e.id)+1}</span>`:""}</button>`).join("")
          +(list.length?"":`<div class="empty">Tidak ada yang cocok. Ketik nama lengkap lalu pilih “Buat”.</div>`);
        const nb=$("#pnew",sc);nb&&(nb.onclick=()=>{creating=true;newExerciseForm($("#plist",sc),q.trim(),ex=>{creating=false;sel.push(ex.id);q="";$("#pq",sc).value="";if(!multi||isSwap)return done();draw();upd()},()=>{creating=false;draw()})});
        upd();
      };
      const upd=()=>{const b=$("#padd",sc);b.disabled=!sel.length;b.textContent=sel.length?(isSwap?"Ganti":`Tambah ${sel.length} gerakan`):"Pilih gerakan"};
      const done=()=>{
        const a=S.active;if(!a){closeSheet();return}
        const mk=id=>{const pv=prevSetsFor(id,a.id);const n=Math.max(1,Math.min(pv.length||3,6));return{exId:id,note:"",sets:Array.from({length:n},()=>({k:"n",w:null,r:null,t:null,d:null,done:false}))}};
        if(isSwap){const[,bid,i]=mode.split(":");const b=findB(bid);b.items[+i]={...mk(sel[0])};}
        else if(mode.startsWith("into:")){const b=findB(mode.slice(5));sel.forEach(id=>b.items.push(mk(id)))}
        else if(mode==="circuit"){a.blocks.push({id:uid(),type:btype,cap:null,rounds:null,items:sel.map(mk)})}
        else sel.forEach(id=>a.blocks.push({id:uid(),type:"single",items:[mk(id)]}));
        save();closeSheet();renderActive();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);
      };
      $("#plist",sc).addEventListener("click",e=>{const p=e.target.closest(".pick[data-id]");if(!p)return;const id=p.dataset.id;
        if(isSwap||!multi){sel.length=0;sel.push(id);return done()}
        const k=sel.indexOf(id);k>-1?sel.splice(k,1):sel.push(id);draw()});
      $("#pq",sc).oninput=e=>{q=e.target.value;draw()};
      $("#padd",sc).onclick=done;
      $$("#ptype button",sc).forEach(x=>x.onclick=()=>{btype=x.dataset.t;$$("#ptype button",sc).forEach(y=>y.setAttribute("aria-pressed",y===x))});
      draw();
    });
}

    <div class="field"><label for="nxEq">Alat</label><select id="nxEq"><option value="">Tanpa alat khusus</option>${S.equipment.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option value="${e.id}" ${e.id===ex.eqId?"selected":""}>${esc(e.name)}</option>`).join("")}<option value="__new">＋ Alat baru…</option></select></div>

    let out;if(existing){Object.assign(existing,data);out=existing}else{out={id:uid(),...data};S.exercises.push(out)}

  };

/* ---------- rest timer ---------- */
let rest=null,restI=null;
function startRest(sec){if(!sec)return;rest={end:Date.now()+sec*1000,total:sec};drawRest();clearInterval(restI);restI=setInterval(drawRest,250)}
function stopRest(){rest=null;clearInterval(restI);$("#rest").hidden=true}
function drawRest(){
  const el=$("#rest");if(!rest){el.hidden=true;return}
  const left=(rest.end-Date.now())/1000;
  if(left<=0){buzz([200,100,200]);toast("Istirahat selesai");stopRest();return}
  if(el.hidden||!el.firstChild){el.hidden=false;el.innerHTML=`<div class="rest-in"><div class="grow"><div class="tiny" style="opacity:.7;font-weight:700;letter-spacing:.08em">ISTIRAHAT</div><b class="num" id="rLeft"></b></div><button data-r="-15">−15</button><button data-r="15">+15</button><button data-r="skip">Lewati</button><span class="bar" id="rBar"></span></div>`;
    el.onclick=e=>{const b=e.target.closest("[data-r]");if(!b||!rest)return;if(b.dataset.r==="skip")return stopRest();rest.end+=+b.dataset.r*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);drawRest()}}
  $("#rLeft").textContent=dur(left);$("#rBar").style.width=(left/rest.total*100)+"%";
}

/* ---------- finish ---------- */
function finishSession(){
  const se=S.active,st=sessionStats(se);
  const undone=se.blocks.reduce((a,b)=>a+b.items.reduce((x,it)=>x+it.sets.filter(s=>!s.done).length,0),0);
  sheet("Selesaikan sesi?",`<div class="kv"><div><b class="num">${durWords((Date.now()-se.start)/1000)}</b><span>Durasi</span></div><div><b class="num">${st.sets}</b><span>Set</span></div><div><b class="num">${fmt(st.vol,0)}</b><span>Volume kg</span></div></div>
  ${undone?`<p class="small muted" style="margin:0">${undone} set belum dicentang dan tidak akan disimpan.</p>`:""}`,
  `<button class="btn grow" data-close>Lanjut latihan</button><button class="btn btn-primary grow" id="fOk">Simpan sesi</button>`,sc=>{
    $("#fOk",sc).onclick=()=>{
      if(!st.sets){toast("Belum ada set yang dicentang");return}
      se.end=Date.now();
      se.blocks=se.blocks.map(b=>({...b,items:b.items.map(it=>({...it,sets:it.sets.filter(s=>s.done)})).filter(it=>it.sets.length)})).filter(b=>b.items.length);
      S.sessions.push(se);S.active=null;stopRest();save();closeSheet();toast("Sesi tersimpan");location.hash="session-"+se.id;
    };
  });
}

  $("#exDel").onclick=()=>{
    if(h.length){toast("Gerakan ini punya riwayat. Gabungkan ke gerakan lain, jangan dihapus.");return}
    confirmSheet("Hapus gerakan?",`${ex.name} akan dihapus dari katalog.`,"Hapus",()=>{S.exercises=S.exercises.filter(x=>x!==ex);save();location.hash="exercises"});
  };
}
function spark(pts,unit){
  if(pts.length<2)return`<p class="muted small" style="margin:0">Grafik muncul setelah gerakan ini dicatat di 2 sesi.</p>`;
  const W=600,H=110,P={l:36,r:10,t:10,b:20};
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(hi-lo<1){lo-=1;hi+=1}const pd=(hi-lo)*.12;lo-=pd;hi+=pd;
  const t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(t1-t0,1);
  const x=t=>P.l+(t-t0)/span*(W-P.l-P.r),y=v=>P.t+(hi-v)/(hi-lo)*(H-P.t-P.b);
  const d=pts.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Grafik progres">
  ${[hi-pd,lo+pd].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-5}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--ink-3)">${fmt(v,0)}</text>`).join("")}
  <path d="${d} L${x(last.t)} ${H-P.b} L${P.l} ${H-P.b} Z" fill="var(--accent)" opacity=".1"/>
  <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  <circle cx="${x(last.t)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)"/>
  <text x="${P.l}" y="${H-4}" font-size="11" fill="var(--ink-3)">${fday(t0)}</text><text x="${W-P.r}" y="${H-4}" font-size="11" text-anchor="end" fill="var(--ink-3)">${fday(t1)}</text></svg>`;
}

  const th=document.documentElement.dataset.theme||"";
  $("#view").innerHTML=`${top("Lainnya")}
  <section class="card pad stack"><h2>Impor dari Hevy</h2>

    <label class="btn btn-primary btn-block" for="hevyFile">Pilih file CSV Hevy</label><input type="file" id="hevyFile" accept=".csv,text/csv" hidden>
  </section>
  <section class="card pad stack"><h2>Cadangan</h2>

    <div class="row"><button class="btn grow" id="expBtn">Unduh cadangan</button><label class="btn grow" for="impFile">Pulihkan</label><input type="file" id="impFile" accept=".json,application/json" hidden></div>
    <p class="tiny muted" style="margin:0" id="dInfo"></p>

    <p class="tiny muted" style="margin:0">Tip: di Safari, tekan Bagikan → Tambah ke Layar Utama supaya Gym Hub terbuka seperti app dan tetap jalan tanpa sinyal.</p>
  </section>`;
  $("#dInfo").textContent=`${S.sessions.length} sesi · ${S.exercises.length} gerakan · ${S.equipment.length} alat`;
  $("#pRest").oninput=e=>{S.prefs.rest=num(e.target.value)??90;save()};
  $$("[data-th]").forEach(b=>b.onclick=()=>{const k=b.dataset.th;if(k)document.documentElement.dataset.theme=k;else delete document.documentElement.dataset.theme;try{localStorage.setItem("gymhub.theme",k)}catch(e){}renderMore()});
  $("#expBtn").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"gym-hub",exportedAt:new Date().toISOString(),...S})],{type:"application/json"}));a.download=`gymhub-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();toast("Cadangan diunduh")}catch(e){toast("Unduhan tidak bisa di sini")}};
  $("#impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.sessions)||!Array.isArray(d.exercises))throw 0;confirmSheet("Pulihkan cadangan?",`Data sekarang diganti dengan ${d.sessions.length} sesi dari file.`,"Pulihkan",()=>{S={v:1,equipment:d.equipment||[],exercises:d.exercises,sessions:d.sessions,active:null,prefs:d.prefs||{rest:90}};save();toast("Cadangan dipulihkan");renderMore()})}catch(err){toast("File bukan cadangan Gym Hub")}})};
  $("#hevyFile").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(hevyPrepare).catch(()=>toast("File tidak bisa dibaca"))};

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x!==""));
}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,mei:4,jun:5,jul:6,aug:7,agu:7,sep:8,oct:9,okt:9,nov:10,dec:11,des:11};
function parseHevyDate(s){
  if(!s)return null;const m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4}),?\s+(\d{1,2}):(\d{2})/);
  if(m&&MON[m[2].toLowerCase()]!=null)return new Date(+m[3],MON[m[2].toLowerCase()],+m[1],+m[4],+m[5]).getTime();
  const t=Date.parse(s);return isNaN(t)?null:t;
}
function hevyPrepare(text){
  const rows=parseCSV(text.replace(/^﻿/,""));if(rows.length<2){toast("CSV kosong");return}
  const H=rows[0].map(h=>h.trim().toLowerCase());const ix=n=>H.indexOf(n);
  const need=["title","start_time","exercise_title"];if(need.some(n=>ix(n)<0)){toast("Ini bukan file ekspor workout Hevy");return}
  const get=(r,n)=>{const i=ix(n);return i<0?"":(r[i]||"").trim()};
  const sessions=new Map();const exNames=new Map();
  rows.slice(1).forEach(r=>{
    const start=parseHevyDate(get(r,"start_time"));if(!start)return;
    const key=start+"|"+get(r,"title");
    if(!sessions.has(key))sessions.set(key,{title:get(r,"title")||"Latihan",start,end:parseHevyDate(get(r,"end_time"))||start,note:get(r,"description"),rows:[]});
    sessions.get(key).rows.push(r);
    const en=get(r,"exercise_title");const st=exNames.get(en)||{n:0,w:0,r:0,t:0,d:0};st.n++;
    if(num(get(r,"weight_kg")))st.w++;if(num(get(r,"reps")))st.r++;if(num(get(r,"duration_seconds")))st.t++;if(num(get(r,"distance_km")))st.d++;exNames.set(en,st);
  });
  const existing=new Set(S.sessions.filter(s=>s.source==="hevy").map(s=>s.hevyKey));
  const fresh=[...sessions.entries()].filter(([k])=>!existing.has(k));
  if(!fresh.length){toast("Semua sesi di file ini sudah pernah diimpor");return}
  const guess=st=>st.d?"dt":st.t&&st.w?"wt":st.t&&!st.r?"t":st.w?"wr":"r";
  const names=[...exNames.keys()].sort();
  const norm=x=>x.toLowerCase().replace(/\s*\([^)]*\)\s*/g," ").replace(/[^a-z0-9]+/g," ").trim();
  const auto=n=>{const e=S.exercises.find(x=>x.name.toLowerCase()===n.toLowerCase())||S.exercises.find(x=>norm(x.name)===norm(n));return e?e.id:"__new"};
  const opts=S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");
  sheet("Impor Hevy",`<div class="kv"><div><b class="num">${fresh.length}</b><span>Sesi baru</span></div><div><b class="num">${names.length}</b><span>Gerakan</span></div><div><b class="num">${fresh.reduce((a,[,s])=>a+s.rows.length,0)}</b><span>Set</span></div></div>
  <p class="small muted" style="margin:0">Cocokkan nama gerakan Hevy dengan katalog Gym Hub. “Buat baru” menambahkannya ke katalog dengan nama yang sama.</p>
  <div>${names.map((n,i)=>`<div class="map"><div><b class="small">${esc(n)}</b><div class="tiny muted">${exNames.get(n).n} set · ${MODES[guess(exNames.get(n))].name}</div></div><select data-map="${i}"><option value="__new">＋ Buat baru</option>${opts}</select></div>`).join("")}</div>`,
  `<button class="btn btn-primary btn-block" id="hvGo">Impor ${fresh.length} sesi</button>`,sc=>{
    names.forEach((n,i)=>{$(`[data-map="${i}"]`,sc).value=auto(n)});
    $("#hvGo",sc).onclick=()=>{
      const map={};let eqHevy=null;
      names.forEach((n,i)=>{let v=$(`[data-map="${i}"]`,sc).value;
        if(v==="__new"){const e={id:uid(),name:n,eqId:"",mode:guess(exNames.get(n)),muscle:"",rest:90};S.exercises.push(e);v=e.id}map[n]=v});
      fresh.forEach(([key,s])=>{
        const blocks=[];let cur=null;
        s.rows.forEach(r=>{
          const en=get(r,"exercise_title"),ss=get(r,"superset_id");
          const set={k:({warmup:"w",failure:"f",dropset:"d"})[get(r,"set_type").toLowerCase()]||"n",w:num(get(r,"weight_kg")),r:num(get(r,"reps")),t:num(get(r,"duration_seconds")),d:num(get(r,"distance_km"))!=null?num(get(r,"distance_km"))*1000:null,done:true};
          const bKey=ss?"ss"+ss:"ex"+en;
          if(!cur||cur.key!==bKey){cur={key:bKey,b:{id:uid(),type:ss?"superset":"single",items:[]}};blocks.push(cur.b)}
          let it=cur.b.items.find(x=>x.exId===map[en]);if(!it){it={exId:map[en],note:get(r,"exercise_notes"),sets:[]};cur.b.items.push(it)}
          it.sets.push(set);
        });
        S.sessions.push({id:uid(),title:s.title,start:s.start,end:s.end,note:s.note,source:"hevy",hevyKey:key,blocks});
      });
      save();closeSheet();toast(`${fresh.length} sesi Hevy diimpor`);location.hash="history";
    };
  });
}
